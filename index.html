<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulau Survival</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden; /* Mencegah layar bisa di-scroll */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none; /* Mencegah zoom/scroll saat disentuh di HP */
        }
        canvas {
            display: block;
        }
        
        #rotateMessage {
    display: none; /* sembunyikan secara default */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.9);
    color: #fff;
    font-size: 24px;
    text-align: center;
    justify-content: center;
    align-items: center;

    flex-direction: column;
}

@media (orientation: portrait) {
    #rotateMessage {
        display: flex; /* tampilkan saat portrait */
    }
}

            display: none;
            position: absolute;
            top: 60%;
            left: 50%;

        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button id="restartButton">Main Lagi</button>
    
    <div id="rotateMessage">
        📱 Putar HP kamu ke mode landscape (miring)
    </div>
    
    <script>
        // ==========================================
        // INISIALISASI CANVAS & RESIZE LISTENER
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartButton = document.getElementById('restartButton');
        
        // Fungsi untuk menyesuaikan ukuran canvas dengan layar browser
        function resizeCanvas() {
    const maxWidth = 1200; // batas maksimal lebar canvas
    const maxHeight = 800; // batas maksimal tinggi canvas
    
    canvas.width = Math.min(window.innerWidth, maxWidth);
    canvas.height = Math.min(window.innerHeight, maxHeight);
}
        
        // Dengarkan perubahan ukuran layar
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); // Panggil pertama kali saat game dimuat

        // Variabel untuk menghitung FPS
        let fps = 0;
        let frameCount = 0;
        let fpsTime = 0;
        
        // Audio
let audioCtx = null;

// Musik latar
let musicOsc1 = null;
let musicOsc2 = null;
let musicGain = null;
let musicEnabled = true;
let musicMelodyInterval = null;
let musicStarted = false;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    if (!musicStarted && musicEnabled) startMusic();
}

function playSound(type) {
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    let freq = 200;
    let durasi = 0.1;
    let volume = 0.15;

    switch (type) {
        case 'chop': freq = 150; durasi = 0.08; volume = 0.12; break;
        case 'hit': freq = 200; durasi = 0.15; volume = 0.2; break;
        case 'eat': freq = 300; durasi = 0.08; volume = 0.2; break;
        case 'place': freq = 400; durasi = 0.1; volume = 0.2; break;
        case 'hurt': freq = 100; durasi = 0.2; volume = 0.25; break;
        case 'levelup': freq = 600; durasi = 0.2; volume = 0.2; break;
        default: freq = 200;
    }

    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + durasi);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + durasi);
}

function startMusic() {
    if (!audioCtx || musicStarted) return;

    musicGain = audioCtx.createGain();
    musicGain.gain.value = musicEnabled ? 0.03 : 0; // volume kecil

    musicOsc1 = audioCtx.createOscillator();
    musicOsc1.type = 'sine';
    musicOsc1.frequency.value = 55; // A1
    musicOsc1.connect(musicGain);

    musicOsc2 = audioCtx.createOscillator();
    musicOsc2.type = 'sine';
    musicOsc2.frequency.value = 110; // A2
    musicOsc2.detune.value = 10; // sedikit detune
    musicOsc2.connect(musicGain);

    musicGain.connect(audioCtx.destination);
    musicOsc1.start();
    musicOsc2.start();

    // Melodi lembut acak setiap 4 detik
    const pentatonic = [220, 247, 277, 330, 370, 440];
    function playMelody() {
        if (!musicEnabled || !audioCtx) return;
        const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0.02;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
    }

    musicMelodyInterval = setInterval(playMelody, 4000);
    musicStarted = true;
}

function stopMusic() {
    if (musicOsc1) {
        musicOsc1.stop();
        musicOsc1 = null;
    }
    if (musicOsc2) {
        musicOsc2.stop();
        musicOsc2 = null;
    }
    if (musicMelodyInterval) {
        clearInterval(musicMelodyInterval);
        musicMelodyInterval = null;
    }
    musicStarted = false;
}

function toggleMusic() {
    musicEnabled = !musicEnabled;
    if (musicGain) {
        musicGain.gain.value = musicEnabled ? 0.03 : 0;
    }
    if (musicEnabled && !musicStarted) {
        startMusic();
    }
}

        // Ukuran dunia
        const worldWidth = 2000;
        const worldHeight = 2000;
        const CAHAYA_VISUAL_RADIUS = 100; // radius cahaya yang terlihat
        const SAFE_ZONE_RADIUS = 120; // radius aman dari serigala
        
        const ITEM_DEFINITIONS = {
    kayu: { nama: 'Kayu', emoji: '🪵' },
    batu: { nama: 'Batu', emoji: '🪨' },
    berry: { nama: 'Berry', emoji: '🫐' },
    daging_mentah: { nama: 'Daging Mentah', emoji: '🥩' },
    daging_masak: { nama: 'Daging Masak', emoji: '🍗' },
    kulit: { nama: 'Kulit', emoji: '🧶' },
    medkit: { nama: 'Medkit', emoji: '💊' },
    kapak: { nama: 'Kapak', emoji: '🪓' },
    campfire: { nama: 'Campfire', emoji: '🔥' },
    dinding: { nama: 'Dinding', emoji: '🧱' }
};

const MAX_STACK = 64; // <-- tambahkan ini

        // Generate bentuk pulau organik yang TETAP (deterministik)
        const pulauPoints = [];
        const jumlahSegmen = 16;
        const radiusDasar = 900;
        
        for (let i = 0; i < jumlahSegmen; i++) {
            const sudut = (i / jumlahSegmen) * Math.PI * 2;
            const variasi = Math.sin(i * 1.5) * 30 + Math.cos(i * 2) * 20;
            const r = radiusDasar + variasi;
            const x = worldWidth / 2 + Math.cos(sudut) * r;
            const y = worldHeight / 2 + Math.sin(sudut) * r;
            pulauPoints.push({ x, y });
        }

        // ==========================================
        // FUNGSI UTILITY (ALAT BANTU)
        // ==========================================
        
        function isInsidePulau(x, y) {
            let inside = false;
            for (let i = 0, j = pulauPoints.length - 1; i < pulauPoints.length; j = i++) {
                const xi = pulauPoints[i].x;
                const yi = pulauPoints[i].y;
                const xj = pulauPoints[j].x;
                const yj = pulauPoints[j].y;
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }
        
        function isInsidePulauMargin(x, y, margin) {
    const points = [
        { x, y },
        { x: x + margin, y },
        { x: x - margin, y },
        { x, y: y + margin },
        { x, y: y - margin },
        { x: x + margin, y: y + margin },
        { x: x - margin, y: y - margin },
        { x: x + margin, y: y - margin },
        { x: x - margin, y: y + margin }
    ];
    return points.every(p => isInsidePulau(p.x, p.y));
}

        function randomPosisiDalamPulau(margin = 0) {
    let x, y;
    do {
        x = Math.random() * (worldWidth - 100) + 50;
        y = Math.random() * (worldHeight - 100) + 50;
    } while (!isInsidePulauMargin(x, y, margin));
    return { x, y };
}
        
        function isBlocked(x, y) {
            const obstacles = [...gameState.resources, ...gameState.campfires, ...gameState.walls];
            for (let obs of obstacles) {
                const dx = x - obs.x;
                const dy = y - obs.y;
                const jarak = Math.sqrt(dx * dx + dy * dy);
                if (jarak < 15) {
                    return true;
                }
            }
            return false;
        }

        // ==========================================
        // CLASS DEFINITIONS (CETAKAN OBJEK)
        // ==========================================
        function drawShadow(x, y, sizeX, sizeY, isCampfire = false) {
    let offsetX = 0;
    let offsetY = 0;
    
    // Bayangan dinamis menjauhi api unggun saat malam, kecuali untuk api unggun itu sendiri
    if (!isCampfire && gameState.malam && gameState.campfires.length > 0) {
        const offset = getShadowOffset(x, y);
        offsetX = offset.dx;
        offsetY = offset.dy;
    }
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.ellipse(x + offsetX, y + offsetY, sizeX, sizeY, 0, 0, Math.PI * 2);
    ctx.fill();
}

function getShadowOffset(x, y) {
    let terdekat = null;
    let jarakTerdekat = Infinity;
    
    for (const camp of gameState.campfires) {
        const dx = x - camp.x;
        const dy = y - camp.y;
        const jarak = Math.sqrt(dx * dx + dy * dy);
        if (jarak < jarakTerdekat) {
            jarakTerdekat = jarak;
            terdekat = camp;
        }
    }
    
    if (!terdekat || jarakTerdekat < 1) return { dx: 0, dy: 0 };
    
    const dx = x - terdekat.x;
    const dy = y - terdekat.y;
    const kuat = Math.max(0, 1 - jarakTerdekat / 300) * 6; // semakin dekat, geser semakin besar (maks 6px)
    
    return {
        dx: (dx / jarakTerdekat) * kuat,
        dy: (dy / jarakTerdekat) * kuat
    };
}


        class Entity {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
        }

        class Player extends Entity {
           constructor() {
                super(worldWidth / 2, worldHeight / 2);
                this.size = 20;
                this.kecepatan = 150;
                this.lastDirX = 0;
                this.lastDirY = 1;
                this.keys = {};
                this.hurtUntil = 0;
                this.isMoving = false;
                this.walkTime = 0;
                this.slowUntil = 0;
            }

            update(deltaTime) {
                let dx = 0;
                let dy = 0;

                if (this.keys['w'] || this.keys['ArrowUp']) dy -= 1;
                if (this.keys['s'] || this.keys['ArrowDown']) dy += 1;
                if (this.keys['a'] || this.keys['ArrowLeft']) dx -= 1;
                if (this.keys['d'] || this.keys['ArrowRight']) dx += 1;

                this.isMoving = dx !== 0 || dy !== 0;

                if (this.isMoving) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;

                    this.lastDirX = dx;
                    this.lastDirY = dy;

                    this.walkTime += deltaTime;

                    let kecepatanSekarang = this.kecepatan;

// Efek slow dari gigitan serigala
if (performance.now() < this.slowUntil) {
    kecepatanSekarang *= 0.5;
}

// Efek slow saat kelaparan
if (gameState.hunger <= 20 && gameState.hunger > 0) {
    kecepatanSekarang *= 0.7; // lapar ringan, 70% kecepatan
} else if (gameState.hunger === 0) {
    kecepatanSekarang *= 0.5; // sangat lapar, 50% kecepatan
}

                    const newX = this.x + dx * kecepatanSekarang * deltaTime;
                    const newY = this.y + dy * kecepatanSekarang * deltaTime;

                    if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
                        this.x = newX;
                    }
                    if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
                        this.y = newY;
                    }
                } else {
                    this.walkTime = 0;
                }
            }

            draw() {
                const x = this.x;
                const y = this.y;
                drawShadow(x, y + 8, 10, 4);

                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                const hurt = performance.now() < this.hurtUntil;
                const warnaBadan = hurt ? '#E74C3C' : '#4A90D9';
                const warnaKulit = hurt ? '#FF6B6B' : '#FFD1A6';

                // Badan
                ctx.fillStyle = warnaBadan;
                ctx.beginPath();
                ctx.ellipse(x, y, 7, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Kepala
                ctx.fillStyle = warnaKulit;
                ctx.beginPath();
                ctx.arc(x, y - 12, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Lengan
                const sway = this.isMoving ? Math.sin(this.walkTime * 12) * 2 : 0;
                const isHorizontal = Math.abs(this.lastDirX) > Math.abs(this.lastDirY);

                if (this.isMoving && isHorizontal) {
                    const side = this.lastDirX > 0 ? 1 : -1;
                    const handX = x + side * 6;
                    const handY = y - 2 + sway;

                    ctx.fillStyle = warnaKulit;
                    ctx.beginPath();
                    ctx.arc(handX, handY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    const leftHandX = x - 8;
                    const leftHandY = y - 2 + sway;
                    const rightHandX = x + 8;
                    const rightHandY = y - 2 - sway;

                    ctx.fillStyle = warnaKulit;
                    ctx.beginPath();
                    ctx.arc(leftHandX, leftHandY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(rightHandX, rightHandY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                
                // Mata & Mulut
                const eyeY = y - 12 + this.lastDirY * 2;
                ctx.fillStyle = '#111';

                if (isHorizontal) {
                    const eyeX = x + this.lastDirX * 3;
                    ctx.beginPath();
                    ctx.arc(eyeX, eyeY, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.beginPath();
                    ctx.arc(x - 2.5, eyeY, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.arc(x + 2.5, eyeY, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillRect(x - 1.5, y - 9, 3, 1);

                // Indikator Penempatan
                const jarakIndikator = 30;
                const indicatorX = x + this.lastDirX * jarakIndikator;
                const indicatorY = y + this.lastDirY * jarakIndikator;

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(indicatorX - 5, indicatorY);
                ctx.lineTo(indicatorX + 5, indicatorY);
                ctx.moveTo(indicatorX, indicatorY - 5);
                ctx.lineTo(indicatorX, indicatorY + 5);
                ctx.stroke();
            }
        }

        class Resource extends Entity {
            constructor(x, y, tipe) {
                super(x, y);
                this.tipe = tipe; 
            }
            
            draw() {
                ctx.strokeStyle = '#111';
                if (this.tipe === 'pohon') {
    drawShadow(this.x, this.y + 10, 18, 5);
} else if (this.tipe === 'batu') {
    drawShadow(this.x, this.y + 9, 14, 4);
} else if (this.tipe === 'semak') {
    drawShadow(this.x, this.y + 10, 12, 4);
}
                ctx.lineWidth = 1.5;
                
                if (this.tipe === 'pohon') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(this.x - 4, this.y - 10, 8, 20);
                    ctx.strokeRect(this.x - 4, this.y - 10, 8, 20);
                    
                    ctx.fillStyle = '#27AE60';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y - 15, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (this.tipe === 'batu') {
                    ctx.fillStyle = '#7F8C8D';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = '#95A5A6';
                    ctx.beginPath();
                    ctx.arc(this.x - 3, this.y - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (this.tipe === 'semak') {
                    ctx.fillStyle = '#2ECC71';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    
                    ctx.fillStyle = '#FF0000';
                    const berries = [
                        { x: this.x - 4, y: this.y - 4 },
                        { x: this.x + 4, y: this.y - 3 },
                        { x: this.x, y: this.y + 5 }
                    ];
                    berries.forEach(b => {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                    });
                }
            }
        }

       class Enemy extends Entity {
            constructor(x, y) {
                super(x, y);
                this.hp = 20;
                this.cooldown = 0;
                this.speed = 1.5;
                this.arahX = Math.random() * 2 - 1;
                this.arahY = Math.random() * 2 - 1;
            }

            update(gameState) {
                if (gameState.gameOver) return;

                const oldX = this.x;
                const oldY = this.y;
                const jarakKePemain = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);
                const playerSafe = gameState.malam && jarakKeCampfireTerdekat() < SAFE_ZONE_RADIUS;

                let kelinciTerdekat = null;
                let jarakKeKelinci = Infinity;
                
                for (let i = 0; i < gameState.kelincis.length; i++) {
                    const k = gameState.kelincis[i];
                    const jarak = Math.sqrt((this.x - k.x) ** 2 + (this.y - k.y) ** 2);
                    if (jarak < jarakKeKelinci) {
                        jarakKeKelinci = jarak;
                        kelinciTerdekat = i;
                    }
                }

                let targetX = null;
                let targetY = null;
                let speed = this.speed;

                if (gameState.malam && jarakKePemain < 250 && !playerSafe) {
                    targetX = gameState.player.x;
                    targetY = gameState.player.y;
                } else if (kelinciTerdekat !== null && jarakKeKelinci < 200) {
                    const target = gameState.kelincis[kelinciTerdekat];
                    targetX = target.x;
                    targetY = target.y;
                    speed = 1.8;
                } else {
                    if (!gameState.malam && jarakKePemain < 120) {
                        const arahX = (this.x - gameState.player.x) / jarakKePemain;
                        const arahY = (this.y - gameState.player.y) / jarakKePemain;
                        
                        const newX = this.x + arahX * 0.5;
                        const newY = this.y + arahY * 0.5;
                        
                        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                    } else {
                        if (!gameState.malam) {
                            const oldIdleX = this.x;
                            const oldIdleY = this.y;
                            
                            this.x += this.arahX * 0.3;
                            this.y += this.arahY * 0.3;
                            
                            if (!isInsidePulau(this.x, this.y) || isBlocked(this.x, this.y)) {
                                this.x = oldIdleX;
                                this.y = oldIdleY;
                                this.ubahArahKeDalam();
                            }
                        }
                    }
                }

                if (targetX !== null && targetY !== null) {
                    const jarakKeTarget = Math.sqrt((targetX - this.x) ** 2 + (targetY - this.y) ** 2);
                    if (jarakKeTarget > 1) {
                        const arahX = (targetX - this.x) / jarakKeTarget;
                        const arahY = (targetY - this.y) / jarakKeTarget;

                        const newX = this.x + arahX * speed;
                        const newY = this.y + arahY * speed;

                        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                    }
                }
                
                if (gameState.malam) {
                    for (let camp of gameState.campfires) {
                        const dx = this.x - camp.x;
                        const dy = this.y - camp.y;
                        const jarak = Math.sqrt(dx * dx + dy * dy);
                        if (jarak < SAFE_ZONE_RADIUS) {
                            const sudut = Math.atan2(dy, dx);
                            this.x = camp.x + Math.cos(sudut) * SAFE_ZONE_RADIUS;
                            this.y = camp.y + Math.sin(sudut) * SAFE_ZONE_RADIUS;
                        }
                    }
                }

                if (!isInsidePulau(this.x, this.y)) {
                    this.x = oldX;
                    this.y = oldY;
                    this.ubahArahKeDalam();
                }

                if (kelinciTerdekat !== null && jarakKeKelinci < 15) {
                    gameState.kelincis.splice(kelinciTerdekat, 1);
                    gameState.jadwalkanRespawn('kelinci');
                    this.hp = Math.min(this.hp + 10, 30);
                    gameState.pesan = '🐺 Serigala memakan kelinci!';
                }

                const jarakSekarang = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);

                if (gameState.malam && jarakSekarang < 25 && this.cooldown <= 0 && !playerSafe) {
                    gameState.kesehatan -= 5;
                    playSound('hurt');
                    if (gameState.kesehatan < 0) gameState.kesehatan = 0;
                    gameState.pesan = '🐺 Kamu digigit serigala!';
                    this.cooldown = 10;
                    
                    gameState.screenShakeUntil = performance.now() + 150;
                    if (gameState.player) {
                        gameState.player.hurtUntil = performance.now() + 200;
                        gameState.player.slowUntil = performance.now() + 3000;
                    }
                    
                    if (gameState.kesehatan === 0) {
                        gameState.gameOver = true;
                        gameState.pesan = 'Kamu mati diserang serigala...';
                    }
                }

                if (this.cooldown > 0) {
                    this.cooldown--;
                }
            }
            
            ubahArahKeDalam() {
                const pusatX = worldWidth / 2;
                const pusatY = worldHeight / 2;
                const dx = pusatX - this.x;
                const dy = pusatY - this.y;
                const jarak = Math.sqrt(dx * dx + dy * dy) || 1;
                const sudut = Math.atan2(dy, dx) + (Math.random() - 0.5) * Math.PI / 3;
                this.arahX = Math.cos(sudut);
                this.arahY = Math.sin(sudut);
            }

            draw() {
                const x = this.x;
                const y = this.y;
                drawShadow(x, y + 10, 14, 5);

                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#95A5A6';
                ctx.beginPath();
                ctx.arc(x + 8, y - 5, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(x + 9, y - 7, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath();
                ctx.arc(x - 12, y + 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        class Kelinci extends Entity {
            constructor(x, y) {
                super(x, y);
                this.arahX = Math.random() * 2 - 1;
                this.arahY = Math.random() * 2 - 1;
                this.timer = Math.floor(Math.random() * 50);
            }

            update(gameState) {
                if (gameState.gameOver) return;

                this.timer++;
                if (this.timer > 50) {
                    this.ubahArahAcak();
                    this.timer = 0;
                }

                const speed = 0.8;

                const newX = this.x + this.arahX * speed;
                if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
                    this.x = newX;
                } else {
                    this.ubahArahAcak(true);
                }

                const newY = this.y + this.arahY * speed;
                if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
                    this.y = newY;
                } else {
                    this.ubahArahAcak(true);
                }
            }

            ubahArahAcak(jauhiLaut = false) {
                if (jauhiLaut) {
                    const pusatX = worldWidth / 2;
                    const pusatY = worldHeight / 2;
                    const dx = pusatX - this.x;
                    const dy = pusatY - this.y;
                    const sudutDasar = Math.atan2(dy, dx);
                    const sudut = sudutDasar + (Math.random() - 0.5) * Math.PI / 2;
                    this.arahX = Math.cos(sudut);
                    this.arahY = Math.sin(sudut);
                } else {
                    const sudut = Math.random() * Math.PI * 2;
                    this.arahX = Math.cos(sudut);
                    this.arahY = Math.sin(sudut);
                }
                this.timer = 0;
            }

            draw() {
                const x = this.x;
                const y = this.y;
                drawShadow(x, y + 6, 10, 4);

                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                ctx.fillStyle = '#D2B48C';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#DEB887';
                ctx.beginPath();
                ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#A0522D';

                ctx.fillStyle = '#FFFFFF';

                ctx.fill();

            }
        }

        function gambarPulau() {
    ctx.beginPath();
    const first = pulauPoints[0];
    ctx.moveTo(first.x, first.y);
    
    for (let i = 1; i < pulauPoints.length; i++) {
        const prev = pulauPoints[i - 1];
        const curr = pulauPoints[i];
        const midX = (prev.x + curr.x) / 2;
        const midY = (prev.y + curr.y) / 2;
        ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
    }
    
    const last = pulauPoints[pulauPoints.length - 1];
    const firstAgain = pulauPoints[0];
    const midX = (last.x + firstAgain.x) / 2;
    const midY = (last.y + firstAgain.y) / 2;
    ctx.quadraticCurveTo(last.x, last.y, midX, midY);
    
    ctx.closePath();
    
    // Isi pasir
    ctx.fillStyle = '#F4D03F';
    ctx.fill();
    
    // Garis pantai (outline)
    ctx.strokeStyle = '#D4A24E';
    ctx.lineWidth = 4;
    ctx.stroke();
}

        function render() {
            const cameraX = gameState.player.x - canvas.width / 2;
            const cameraY = gameState.player.y - canvas.height / 2;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#2E86C1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let shakeX = 0;
            let shakeY = 0;
            if (performance.now() < gameState.screenShakeUntil) {
                shakeX = (Math.random() - 0.5) * gameState.screenShakeIntensity;
                shakeY = (Math.random() - 0.5) * gameState.screenShakeIntensity;
            }
            
            ctx.save();
            ctx.translate(-cameraX + shakeX, -cameraY + shakeY);

            gambarPulau();

            const entitiesToRender = [
                ...gameState.resources,
                ...gameState.campfires,
                ...gameState.walls,
                ...gameState.kelincis,
                ...gameState.enemies,
                gameState.player
            ];

            entitiesToRender.sort((a, b) => a.y - b.y);
            entitiesToRender.forEach(entity => entity.draw());

            ctx.restore();

            if (gameState.malam) {
                ctx.fillStyle = 'rgba(0,0,40,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const waktu = performance.now();
                
                gameState.campfires.forEach((c, index) => {
                    const screenX = c.x - cameraX + shakeX;
                    const screenY = c.y - cameraY + shakeY;
                    
                    const flicker = Math.sin(waktu * 0.001 + index * 1.5) * 0.5 + 0.5;
                    const radius = CAHAYA_VISUAL_RADIUS + flicker * 20;
                    const alpha = 0.6 + flicker * 0.25; 
                    
                    const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, radius);
                    gradient.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
                    gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
                    
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, radius, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            gambarUI();
        }

        // ==========================================
        // GAMEPLAY FUNCTIONS (FUNGSI MEKANIK)
        // ==========================================

        function tambahXP(jumlah) {
            gameState.xp += jumlah;
            if (gameState.xp >= gameState.xpPerLevel) {
                gameState.xp -= gameState.xpPerLevel;
                gameState.level++;
                playSound('levelup');
                gameState.pesan = 'LEVEL UP! Sekarang level ' + gameState.level + ' (serangan makin kuat)';
            }
        }
        
        function addItem(id, jumlah = 1) {
    // Coba tambahkan ke slot yang sudah berisi item sama dan belum penuh
    for (let i = 0; i < gameState.slots.length; i++) {
        const slot = gameState.slots[i];
        if (slot && slot.id === id && slot.jumlah < MAX_STACK) {
            const available = MAX_STACK - slot.jumlah;
            const adding = Math.min(available, jumlah);
            slot.jumlah += adding;
            jumlah -= adding;
            if (jumlah <= 0) return;
        }
    }
    
    // Jika masih sisa, cari slot kosong
    for (let i = 0; i < gameState.slots.length; i++) {
        if (!gameState.slots[i]) {
            gameState.slots[i] = { id, jumlah };
            return;
        }
    }
    
    // Jika inventory penuh, sisanya tidak masuk
    gameState.pesan = 'Inventory penuh!';
}

function removeItem(id, jumlah = 1) {
    for (let i = 0; i < gameState.slots.length; i++) {
        const slot = gameState.slots[i];
        if (slot && slot.id === id) {
            const removed = Math.min(slot.jumlah, jumlah);
            slot.jumlah -= removed;
            jumlah -= removed;
            if (slot.jumlah <= 0) {
                gameState.slots[i] = null;
            }
            if (jumlah <= 0) return true;
        }
    }
    return false;
}

function getItemCount(id) {
    let total = 0;
    for (const slot of gameState.slots) {
        if (slot && slot.id === id) total += slot.jumlah;
    }
    return total;
}

        function makanBerry() {
    if (getItemCount('berry') > 0) {
        if (gameState.hunger < 100) {
            playSound('eat');
            removeItem('berry', 1);
            gameState.hunger += 20;
            if (gameState.hunger > 100) gameState.hunger = 100;
            gameState.pesan = '🫐 Kamu makan berry (+20 hunger)';
        } else {
            gameState.pesan = 'Hunger sudah penuh!';
        }
    } else {
        gameState.pesan = 'Kamu tidak punya berry!';
    }
}

        function makanDaging() {
    if (getItemCount('daging_masak') > 0) {
        playSound('eat');
        removeItem('daging_masak', 1);
        gameState.hunger += 25;
        if (gameState.hunger > 100) gameState.hunger = 100;
        gameState.pesan = '🍗 Kamu makan daging masak (+25 hunger)';
    } else if (getItemCount('daging_mentah') > 0) {
        playSound('eat');
        removeItem('daging_mentah', 1);
        gameState.hunger += 15;
        if (gameState.hunger > 100) gameState.hunger = 100;
        if (Math.random() < 0.5) {
            gameState.kesehatan -= 5;
            if (gameState.kesehatan < 0) gameState.kesehatan = 0;
            gameState.pesan = '🥩 Kamu makan daging mentah dan sakit (-5 health)';
        } else {
            gameState.pesan = '🥩 Kamu makan daging mentah (+15 hunger)';
        }
    } else {
        gameState.pesan = 'Kamu tidak punya daging!';
    }
}

        function craftKapak() {
            if (gameState.punyaKapak) {
                gameState.pesan = 'Kamu sudah punya kapak!';
                return;
            }
           if (getItemCount('kayu') >= 4 && getItemCount('batu') >= 2) {
    removeItem('kayu', 4);
    removeItem('batu', 2);
    addItem('kapak', 1);
    gameState.punyaKapak = true;
                gameState.pesan = '🪓 Berhasil membuat Kapak Batu!';
                tambahXP(15);
            } else {
                gameState.pesan = 'Bahan tidak cukup! Butuh 4 kayu dan 2 batu.';
            }
        }

       function buatCampfire() {
            if (getItemCount('kayu') < 5) {
                gameState.pesan = 'Butuh 5 kayu untuk membuat campfire!';
                return;
            }

            const player = gameState.player;
            const jarak = 30;
            const arahX = player.lastDirX ;
            const arahY = player.lastDirY ;

            const newX = player.x + arahX * jarak;
            const newY = player.y + arahY * jarak;

            if (isInsidePulau(newX, newY) && !isBlocked(newX, newY)) {
                 removeItem('kayu', 5);
                gameState.campfires.push(new Campfire(newX, newY));
                playSound('place');
                gameState.pesan = '🔥 Campfire diletakkan di depanmu!';
                tambahXP(15);
            } else {
                gameState.pesan = 'Tidak bisa menaruh campfire di sana!';
            }
        }

        function buatDinding() {
            if (getItemCount('kayu') < 2 || getItemCount('batu') < 1) {
                gameState.pesan = 'Bahan tidak cukup! Butuh 2 kayu dan 1 batu.';
                return;
            }

            const player = gameState.player;
            const jarak = 30;
            const arahX = player.lastDirX ;
            const arahY = player.lastDirY ;

            const newX = player.x + arahX * jarak;
            const newY = player.y + arahY * jarak;

            if (isInsidePulau(newX, newY) && !isBlocked(newX, newY)) {
                removeItem('kayu',2);
                removeItem('batu',1);
                gameState.walls.push(new Wall(newX, newY));
                playSound('place');
                gameState.pesan = '🧱 Dinding dibangun!';
                tambahXP(10);
            } else {
                gameState.pesan = 'Tidak bisa membangun dinding di sana!';
            }
        }

        function masakDaging() {
            let dekatCampfire = false;
            for (let i = 0; i < gameState.campfires.length; i++) {
                const c = gameState.campfires[i];
                const jarak = Math.sqrt((gameState.player.x - c.x) ** 2 + (gameState.player.y - c.y) ** 2);
                if (jarak <= 50) {
                    dekatCampfire = true;
                    break;
                }
            }

            if (!dekatCampfire) {
                gameState.pesan = 'Kamu harus dekat dengan campfire untuk memasak!';
                return;
            }

            if (getItemCount('daging_mentah') > 0) {
    removeItem('daging_mentah', 1);
    addItem('daging_masak', 1);
    gameState.pesan = '🍗 Daging mentah dimasak! (+1 daging masak)';
    tambahXP(5);
} else {
    gameState.pesan = 'Kamu tidak punya daging mentah!';
}
        }

        function jarakKeCampfireTerdekat() {
            let jarakTerdekat = Infinity;
            for (let i = 0; i < gameState.campfires.length; i++) {
                const c = gameState.campfires[i];
                const dx = gameState.player.x - c.x;
                const dy = gameState.player.y - c.y;
                const jarak = Math.sqrt(dx * dx + dy * dy);
                if (jarak < jarakTerdekat) jarakTerdekat = jarak;
            }
            return jarakTerdekat;
        }

        function buatMedkit() {
            if (getItemCount('berry') >= 3 && getItemCount('kulit') >= 2) {
                 removeItem('berry', 3);
                removeItem('kulit', 2);
                addItem('medkit',1);
                gameState.pesan = '💊 Berhasil membuat Medkit!';
                tambahXP(10);
            } else {
                gameState.pesan = 'Bahan tidak cukup! Butuh 3 berry dan 2 kulit.';
            }
        }

        function gunakanMedkit() {
            if (getItemCount('medkit') <= 0) {
                gameState.pesan = 'Kamu tidak punya Medkit!';
                return;
            }
            
            if (gameState.kesehatan >= 100) {
                gameState.pesan = 'Darahmu masih penuh!';
                return;
            }
            
            removeItem('medkit');
            gameState.kesehatan += 50;
            if (gameState.kesehatan > 100) gameState.kesehatan = 100;
            gameState.pesan = '💊 Kamu menggunakan Medkit (+50 Health)';
        }

        function updateWaktu() {
            if (gameState.gameOver) return;

            gameState.jam += 0.01;
            if (gameState.jam >= 24) gameState.jam = 0;

            gameState.malam = gameState.jam >= 18 || gameState.jam < 6;
        }
        
        function isInFront(player, targetX, targetY, tolerance = 0.5) {
    const dx = targetX - player.x;
    const dy = targetY - player.y;
    const jarak = Math.sqrt(dx * dx + dy * dy);
    if (jarak === 0) return true; // tepat di atas target
    
    const normX = dx / jarak;
    const normY = dy / jarak;
    
    const dot = normX * player.lastDirX + normY * player.lastDirY;
    return dot > tolerance; // tolerance 0.5 ≈ sudut 60 derajat
}

        function interaksi() {
    const player = gameState.player;
    
    // ===== 1. Cari musuh di depan dalam jarak serang =====
    let musuhTerdekat = null;
    let jarakMusuh = Infinity;
    for (let i = 0; i < gameState.enemies.length; i++) {
        const m = gameState.enemies[i];
        const d = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);
        if (d < 50 && isInFront(player, m.x, m.y) && d < jarakMusuh) {
            jarakMusuh = d;
            musuhTerdekat = i;
        }
    }
    
    if (musuhTerdekat !== null) {
        const damage = 10 + (gameState.level - 1) * 5;
        gameState.enemies[musuhTerdekat].hp -= damage;
        playSound('hit');
        gameState.pesan = '⚔️ Kamu menyerang serigala! (-' + damage + ' HP)';
        if (gameState.enemies[musuhTerdekat].hp <= 0) {
            gameState.pesan = '💀 Serigala mati!';
            gameState.enemies.splice(musuhTerdekat, 1);
            gameState.jadwalkanRespawn('serigala');
            tambahXP(20);
        }
        return;
    }
    
    // ===== 2. Cari kelinci di depan dalam jarak buru =====
    let kelinciTerdekat = null;
    let jarakKelinci = Infinity;
    for (let i = 0; i < gameState.kelincis.length; i++) {
        const k = gameState.kelincis[i];
        const d = Math.sqrt((player.x - k.x) ** 2 + (player.y - k.y) ** 2);
        if (d <= 30 && isInFront(player, k.x, k.y) && d < jarakKelinci) {
            jarakKelinci = d;
            kelinciTerdekat = i;
        }
    }
    
    if (kelinciTerdekat !== null) {
        playSound('hit');
        gameState.kelincis.splice(kelinciTerdekat, 1);
        gameState.jadwalkanRespawn('kelinci');
        addItem('daging_mentah', 2);
addItem('kulit', 1);
        gameState.pesan = '🐇 Berhasil berburu kelinci! (+2 daging mentah, +1 kulit)';
        tambahXP(10);
        return;
    }
    
    // ===== 3. Cari resource di depan dalam jarak kumpul =====
    let resourceTerdekat = null;
    let jarakResource = Infinity;
    for (let i = 0; i < gameState.resources.length; i++) {
        const r = gameState.resources[i];
        const d = Math.sqrt((player.x - r.x) ** 2 + (player.y - r.y) ** 2);
        if (d <= 30 && isInFront(player, r.x, r.y) && d < jarakResource) {
            jarakResource = d;
            resourceTerdekat = i;
        }
    }
    
    if (resourceTerdekat !== null) {
        const r = gameState.resources[resourceTerdekat];
        const tipe = r.tipe;
        gameState.resources.splice(resourceTerdekat, 1);
        gameState.jadwalkanRespawn(tipe);
        
        if (tipe === 'pohon') {
            playSound('chop');
    const banyak = gameState.punyaKapak ? 5 : 3;
    addItem('kayu', banyak);
    gameState.pesan = `🪵 Kayu +${banyak} ${gameState.punyaKapak ? '(dengan kapak)' : ''}`;
} else if (tipe === 'batu') {
    playSound('hit');
    addItem('batu', 2);
    gameState.pesan = '🪨 Batu +2';
} else if (tipe === 'semak') {
    playSound('chop');
    addItem('berry', 2);
    gameState.pesan = '🫐 Berry +2';
}
        tambahXP(5);
        return;
    }
    
    // Tidak ada target di depan
    gameState.pesan = 'Tidak ada objek di depanmu.';
}

        // ==========================================
        // INPUT / KONTROL KEYBOARD
        // ==========================================
        
        

        document.addEventListener('keydown', function(event) {
    initAudio(); // aktifkan audio saat tombol ditekan
    
    if (event.key === 'k' || event.key === 'K') {
    toggleMusic();
    return;
}
    
    if (event.key === 'Tab') {
        event.preventDefault();
        gameState.showMenu = !gameState.showMenu;
        return;
    }
    if (event.key === 'i' || event.key === 'I') {
        gameState.showMenu = !gameState.showMenu;
        return;
    }
    
    if (gameState.gameOver) {
        if (event.key === 'r' || event.key === 'R') {
            const saveAda = localStorage.getItem('pulauSurvivalSave');
            if (saveAda) {
                gameState.muatGame();
            } else {
                gameState.restartGame();
            }
        }
        return;
    }
    
    if (['1', '2', '3', '4', '5', '6', '7', '8'].includes(event.key)) {
        gameState.selectedSlot = parseInt(event.key) - 1;
        render();
        return;
    }
    
    gameState.keys[event.key] = true;
    
    if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
        event.preventDefault();
    }
    
    if (event.key === 'e' || event.key === 'E') {
        interaksi();
    }
    if (event.key === ' ') {
        event.preventDefault();
        interaksi();
    }
    if (event.key === 'c' || event.key === 'C') {
        craftKapak();
    }
    if (event.key === 'q' || event.key === 'Q') {
        makanBerry();
    }
    if (event.key === 't' || event.key === 'T') {
        makanDaging();
    }
    if (event.key === 'b' || event.key === 'B') {
        buatCampfire();
    }
    if (event.key === 'm' || event.key === 'M') {
        buatMedkit();
    }
    if (event.key === 'h' || event.key === 'H') {
        gunakanMedkit();
    }
    if (event.key === 'n' || event.key === 'N') {
        buatDinding();
    }
    if (event.key === 'p' || event.key === 'P') {
        gameState.simpanGame();
    }
    if (event.key === 'l' || event.key === 'L') {
        gameState.muatGame();
    }
});

document.addEventListener('touchstart', initAudio);

        document.addEventListener('keyup', function(event) {
            gameState.keys[event.key] = false;
        });

        restartButton.addEventListener('click', function() {
    const saveAda = localStorage.getItem('pulauSurvivalSave');
    if (saveAda) {
        gameState.muatGame();
    } else {
        gameState.restartGame();
    }
});

        // ==========================================
        // GAME LOOP UTAMA
        // ==========================================

        function gameLoop(now) {
            if (!gameState.gameOver) {
                const deltaTime = Math.min((now - gameState.lastFrameTime) / 1000, 0.1);
                gameState.lastFrameTime = now;
                
                frameCount++;
                fpsTime += deltaTime;
                if (fpsTime >= 0.5) {
                    fps = frameCount / fpsTime;
                    frameCount = 0;
                    fpsTime = 0;
                }

                gameState.player.keys = gameState.keys;
                gameState.player.update(deltaTime);

                if (now - gameState.lastUpdateTime >= 100) {
                    updateWaktu();
                    gameState.enemies.forEach(e => e.update(gameState));
                    gameState.kelincis.forEach(k => k.update(gameState));
                    gameState.cekRespawn();
                    gameState.lastUpdateTime = now;
                }

                if (now - gameState.lastHungerTime >= 2000) {
                    const jarakCampfire = jarakKeCampfireTerdekat();
                    if (gameState.malam && jarakCampfire < 100) {
                        gameState.hunger -= 1; 
                    } else {
                        gameState.hunger -= (gameState.malam ? 3 : 2);
                    }
                    if (gameState.hunger < 0) gameState.hunger = 0;

                    if (gameState.hunger === 0) {
    gameState.kesehatan -= 1;
    if (gameState.kesehatan < 0) gameState.kesehatan = 0;
    
    // Efek visual saat benar-benar kelaparan
    gameState.screenShakeUntil = performance.now() + 120;
    if (gameState.player) {
        gameState.player.hurtUntil = performance.now() + 350;
    }
    gameState.pesan = '⚠️ Kamu kelaparan!';
    playSound('hurt');
    
    if (gameState.kesehatan === 0) {
        gameState.gameOver = true;
        gameState.pesan = 'Kamu mati kelaparan...';
    }
}

                    gameState.lastHungerTime = now;
                }
                
                // Auto-save setiap 30 detik
if (now - gameState.lastAutoSaveTime >= 30000) {
    gameState.simpanGame();
    gameState.lastAutoSaveTime = now;
}
            }

            render();
            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // MULAI GAME
        // ==========================================
        
        gameState.restartGame();
        gameState.player.keys = gameState.keys;
        requestAnimationFrame(gameLoop);
        
    </script>
