<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulau Survival</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #87CEEB;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        #restartButton {
            display: none;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-size: 20px;
            background: #FF5722;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button id="restartButton">Main Lagi</button>
    <script>
        // =====================
        // GAME KITA MULAI DI SINI
        // =====================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartButton = document.getElementById('restartButton');

        // Ukuran dunia
        const worldWidth = 1000;
        const worldHeight = 1000;

        // Generate bentuk pulau organik yang TETAP (deterministik)
        const pulauPoints = [];
        const jumlahSegmen = 16;
        const radiusDasar = 400;
        for (let i = 0; i < jumlahSegmen; i++) {
            const sudut = (i / jumlahSegmen) * Math.PI * 2;
            const variasi = Math.sin(i * 1.5) * 30 + Math.cos(i * 2) * 20;
            const r = radiusDasar + variasi;
            const x = worldWidth / 2 + Math.cos(sudut) * r;
            const y = worldHeight / 2 + Math.sin(sudut) * r;
            pulauPoints.push({ x, y });
        }

        // Fungsi cek apakah titik berada di dalam pulau
        function isInsidePulau(x, y) {
            let inside = false;
            for (let i = 0, j = pulauPoints.length - 1; i < pulauPoints.length; j = i++) {
                const xi = pulauPoints[i].x;
                const yi = pulauPoints[i].y;
                const xj = pulauPoints[j].x;
                const yj = pulauPoints[j].y;
                const intersect = ((yi > y) !== (yj > y)) &&
                    (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Fungsi mendapatkan posisi acak di dalam pulau
        function randomPosisiDalamPulau() {
            let x, y;
            do {
                x = Math.random() * (worldWidth - 100) + 50;
                y = Math.random() * (worldHeight - 100) + 50;
            } while (!isInsidePulau(x, y));
            return { x, y };
        }

        // Posisi pemain di tengah dunia
        let playerX, playerY;
        const playerSize = 20;

        // Kamera
        let cameraX = 0;
        let cameraY = 0;

        // Status tombol yang ditekan
        const keys = {};

        // Waktu untuk delta time
        let lastFrameTime = performance.now();
        let lastUpdateTime = performance.now();
        let lastHungerTime = performance.now();
        const kecepatanPemain = 200; // piksel per detik

        // Inventory dan status
        let jumlahKayu, jumlahBatu, jumlahBerry, jumlahDagingMentah, jumlahDagingMasak, jumlahKulit;
        let punyaKapak, pesan;

        // XP dan Level
        let xp, level;
        const xpPerLevel = 50;

        // Status survival
        let hunger, kesehatan, gameOver;

        // Waktu
        let jam, malam;

        // Resource arrays
        const pohon = [];
        const batu = [];
        const semak = [];
        const musuh = [];
        const kelinci = [];
        const campfires = [];
        const respawnList = [];

        const RESPAWN_DELAY_POHON = 120000;
        const RESPAWN_DELAY_BATU = 120000;
        const RESPAWN_DELAY_SEMAK = 90000;
        const RESPAWN_DELAY_KELINCI = 90000;

        const SAVE_KEY = 'pulauSurvivalSave';

        // =====================
        // INISIALISASI GAME
        // =====================

        function generateResources() {
            // Kosongkan semua array
            pohon.length = 0;
            batu.length = 0;
            semak.length = 0;
            musuh.length = 0;
            kelinci.length = 0;
            campfires.length = 0;
            respawnList.length = 0;

            // Jumlah awal acak
            const jumlahPohonAwal = Math.floor(Math.random() * 6) + 12;
            const jumlahBatuAwal = Math.floor(Math.random() * 5) + 8;
            const jumlahSemakAwal = Math.floor(Math.random() * 6) + 10;

            for (let i = 0; i < jumlahPohonAwal; i++) {
                const pos = randomPosisiDalamPulau();
                pohon.push({ x: pos.x, y: pos.y });
            }
            for (let i = 0; i < jumlahBatuAwal; i++) {
                const pos = randomPosisiDalamPulau();
                batu.push({ x: pos.x, y: pos.y });
            }
            for (let i = 0; i < jumlahSemakAwal; i++) {
                const pos = randomPosisiDalamPulau();
                semak.push({ x: pos.x, y: pos.y });
            }

            // Musuh serigala
            for (let i = 0; i < 4; i++) {
                const pos = randomPosisiDalamPulau();
                musuh.push({ x: pos.x, y: pos.y, hp: 20, cooldown: 0 });
            }

            // Kelinci
            for (let i = 0; i < 5; i++) {
                const pos = randomPosisiDalamPulau();
                kelinci.push({
                    x: pos.x,
                    y: pos.y,
                    arahX: Math.random() * 2 - 1,
                    arahY: Math.random() * 2 - 1,
                    timer: Math.floor(Math.random() * 50)
                });
            }
        }

        function resetStateVariables() {
            playerX = worldWidth / 2;
            playerY = worldHeight / 2;

            jumlahKayu = 0;
            jumlahBatu = 0;
            jumlahBerry = 0;
            jumlahDagingMentah = 0;
            jumlahDagingMasak = 0;
            jumlahKulit = 0;
            punyaKapak = false;
            pesan = 'Kamu hidup kembali!';

            xp = 0;
            level = 1;

            hunger = 100;
            kesehatan = 100;
            gameOver = false;

            jam = 8;
            malam = false;
        }

        function restartGame() {
            resetStateVariables();
            generateResources();

            lastUpdateTime = performance.now();
            lastHungerTime = performance.now();
            lastFrameTime = performance.now();

            restartButton.style.display = 'none';
        }

        // =====================
        // SAVE & LOAD
        // =====================

        function simpanGame() {
            try {
                const data = {
                    playerX,
                    playerY,
                    jumlahKayu,
                    jumlahBatu,
                    jumlahBerry,
                    jumlahDagingMentah,
                    jumlahDagingMasak,
                    jumlahKulit,
                    punyaKapak,
                    pesan,
                    xp,
                    level,
                    hunger,
                    kesehatan,
                    gameOver,
                    jam,
                    malam,
                    pohon: pohon.map(p => ({ x: p.x, y: p.y })),
                    batu: batu.map(b => ({ x: b.x, y: b.y })),
                    semak: semak.map(s => ({ x: s.x, y: s.y })),
                    musuh: musuh.map(m => ({ x: m.x, y: m.y, hp: m.hp, cooldown: m.cooldown })),
                    kelinci: kelinci.map(k => ({
                        x: k.x,
                        y: k.y,
                        arahX: k.arahX,
                        arahY: k.arahY,
                        timer: k.timer
                    })),
                    campfires: campfires.map(c => ({ x: c.x, y: c.y })),
                    respawnList: respawnList.map(r => ({ tipe: r.tipe, waktu: r.waktu }))
                };

                localStorage.setItem(SAVE_KEY, JSON.stringify(data));
                pesan = '💾 Game disimpan!';
                render();
            } catch (e) {
                pesan = '❌ Gagal menyimpan game!';
                render();
            }
        }

        function muatGame() {
            try {
                const json = localStorage.getItem(SAVE_KEY);
                if (!json) {
                    pesan = '❌ Tidak ada data save!';
                    render();
                    return;
                }

                const data = JSON.parse(json);

                // Reset dulu state & resource agar bersih
                restartGame();

                // Terapkan data tersimpan
                playerX = data.playerX;
                playerY = data.playerY;
                jumlahKayu = data.jumlahKayu;
                jumlahBatu = data.jumlahBatu;
                jumlahBerry = data.jumlahBerry;
                jumlahDagingMentah = data.jumlahDagingMentah;
                jumlahDagingMasak = data.jumlahDagingMasak;
                jumlahKulit = data.jumlahKulit;
                punyaKapak = data.punyaKapak;
                pesan = '📂 Game dimuat!';
                xp = data.xp;
                level = data.level;
                hunger = data.hunger;
                kesehatan = data.kesehatan;
                gameOver = data.gameOver;
                jam = data.jam;
                malam = data.malam;

                // Isi ulang array
                pohon.length = 0;
                data.pohon.forEach(p => pohon.push({ x: p.x, y: p.y }));

                batu.length = 0;
                data.batu.forEach(b => batu.push({ x: b.x, y: b.y }));

                semak.length = 0;
                data.semak.forEach(s => semak.push({ x: s.x, y: s.y }));

                musuh.length = 0;
                data.musuh.forEach(m => musuh.push({ x: m.x, y: m.y, hp: m.hp, cooldown: m.cooldown }));

                kelinci.length = 0;
                data.kelinci.forEach(k => kelinci.push({
                    x: k.x,
                    y: k.y,
                    arahX: k.arahX,
                    arahY: k.arahY,
                    timer: k.timer
                }));

                campfires.length = 0;
                data.campfires.forEach(c => campfires.push({ x: c.x, y: c.y }));

                respawnList.length = 0;
                data.respawnList.forEach(r => respawnList.push({ tipe: r.tipe, waktu: r.waktu }));

                // Reset timing
                lastUpdateTime = performance.now();
                lastHungerTime = performance.now();
                lastFrameTime = performance.now();

                restartButton.style.display = 'none';
                render();
            } catch (e) {
                pesan = '❌ Data save korup!';
                render();
            }
        }

        // Inisialisasi pertama
        restartGame();

        // =====================
        // FUNGSI GAMBAR
        // =====================

        function gambarPulau() {
            ctx.fillStyle = '#F4D03F';
            ctx.beginPath();
            const first = pulauPoints[0];
            ctx.moveTo(first.x, first.y);

            for (let i = 1; i < pulauPoints.length; i++) {
                const prev = pulauPoints[i - 1];
                const curr = pulauPoints[i];
                const midX = (prev.x + curr.x) / 2;
                const midY = (prev.y + curr.y) / 2;
                ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
            }

            const last = pulauPoints[pulauPoints.length - 1];
            const firstAgain = pulauPoints[0];
            const midX = (last.x + firstAgain.x) / 2;
            const midY = (last.y + firstAgain.y) / 2;
            ctx.quadraticCurveTo(last.x, last.y, midX, midY);

            ctx.closePath();
            ctx.fill();
        }

        function gambarPemain() {
            ctx.fillStyle = '#E74C3C';
            ctx.fillRect(playerX - playerSize / 2, playerY - playerSize / 2, playerSize, playerSize);
        }

        function gambarPohon(x, y) {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - 4, y - 10, 8, 20);
            ctx.fillStyle = '#27AE60';
            ctx.beginPath();
            ctx.arc(x, y - 15, 12, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarBatu(x, y) {
            ctx.fillStyle = '#7F8C8D';
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#95A5A6';
            ctx.beginPath();
            ctx.arc(x - 3, y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarSemak(x, y) {
            ctx.fillStyle = '#2ECC71';
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(x - 4, y - 4, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 4, y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x, y + 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarMusuh(x, y) {
            ctx.fillStyle = '#7F8C8D';
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#95A5A6';
            ctx.beginPath();
            ctx.arc(x + 8, y - 5, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.arc(x + 9, y - 7, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#7F8C8D';
            ctx.beginPath();
            ctx.arc(x - 12, y + 5, 5, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarKelinci(x, y) {
            ctx.fillStyle = '#D2B48C';
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#DEB887';
            ctx.beginPath();
            ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#A0522D';
            ctx.fillRect(x + 3, y - 12, 2, 6);
            ctx.fillRect(x + 6, y - 12, 2, 6);
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(x - 8, y + 2, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarCampfire(x, y) {
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x - 8, y, 16, 4);
            ctx.fillRect(x - 4, y - 6, 16, 4);
            ctx.fillStyle = '#FF4500';
            ctx.beginPath();
            ctx.arc(x, y - 4, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x, y - 5, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function gambarUI() {
            ctx.font = '16px Arial, sans-serif';

            // Health bar
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('❤️ Health:', 10, 25);
            ctx.fillStyle = '#555';
            ctx.fillRect(100, 12, 80, 12);
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(100, 12, kesehatan, 12);

            // Hunger bar
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('🍖 Hunger:', 10, 50);
            ctx.fillStyle = '#555';
            ctx.fillRect(100, 37, 80, 12);
            ctx.fillStyle = '#FFA500';
            ctx.fillRect(100, 37, hunger, 12);

            // Inventory dengan emoji
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('🪵 Kayu: ' + jumlahKayu, 10, 75);
            ctx.fillText('🪨 Batu: ' + jumlahBatu, 10, 95);
            ctx.fillText('🫐 Berry: ' + jumlahBerry, 10, 115);
            ctx.fillText('🥩 Daging M: ' + jumlahDagingMentah, 10, 135);
            ctx.fillText('🍗 Daging K: ' + jumlahDagingMasak, 10, 155);
            ctx.fillText('🧶 Kulit: ' + jumlahKulit, 10, 175);
            ctx.fillText('🪓 Kapak: ' + (punyaKapak ? 'Ya' : 'Tidak'), 10, 195);
            ctx.fillText('🔥 Campfire: ' + campfires.length, 10, 215);

            // Level & XP
            ctx.fillStyle = '#00FFFF';
            ctx.fillText('⭐ Level: ' + level + '  XP: ' + xp + '/' + xpPerLevel, 10, 245);

            // Waktu
            ctx.fillStyle = '#FFFF00';
            ctx.fillText('🕒 Waktu: ' + Math.floor(jam) + ':00 ' + (malam ? '🌙 Malam' : '☀️ Siang'), 10, 270);

            // Kontrol
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('E=Kumpul  C=Kapak  Q=Berry  T=Makan Daging', 10, 300);
            ctx.fillText('F=Buruan  B=Campfire  R=Masak  SPASI=Serang', 10, 320);
            ctx.fillText('P=Simpan  L=Muat', 10, 340);

            if (pesan !== '') {
                ctx.fillStyle = '#FFFF00';
                ctx.fillText(pesan, 10, 370);
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FF0000';
                ctx.font = 'bold 30px Arial';
                ctx.fillText('💀 GAME OVER', 250, 180);
                ctx.font = '16px Arial';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText('Kamu mati... Tekan R atau klik "Main Lagi"', 180, 230);
                restartButton.style.display = 'block';
            } else {
                restartButton.style.display = 'none';
            }
        }

        function render() {
            cameraX = playerX - canvas.width / 2;
            cameraY = playerY - canvas.height / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#2E86C1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, -cameraY);

            gambarPulau();

            pohon.forEach(function(p) {
                gambarPohon(p.x, p.y);
            });

            batu.forEach(function(b) {
                gambarBatu(b.x, b.y);
            });

            semak.forEach(function(s) {
                gambarSemak(s.x, s.y);
            });

            campfires.forEach(function(c) {
                gambarCampfire(c.x, c.y);
            });

            kelinci.forEach(function(k) {
                gambarKelinci(k.x, k.y);
            });

            musuh.forEach(function(m) {
                gambarMusuh(m.x, m.y);
            });

            gambarPemain();

            ctx.restore();

            if (malam) {
                ctx.fillStyle = 'rgba(0,0,40,0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            gambarUI();
        }

        // =====================
        // FUNGSI GAMEPLAY
        // =====================

        function tambahXP(jumlah) {
            xp += jumlah;
            if (xp >= xpPerLevel) {
                xp -= xpPerLevel;
                level++;
                pesan = 'LEVEL UP! Sekarang level ' + level + ' (serangan makin kuat)';
            }
        }

        function kumpulkanResource() {
            for (let i = 0; i < pohon.length; i++) {
                const p = pohon[i];
                const jarak = Math.sqrt((playerX - p.x) ** 2 + (playerY - p.y) ** 2);
                if (jarak <= 30) {
                    pohon.splice(i, 1);
                    jadwalkanRespawn('pohon');
                    if (punyaKapak) {
                        jumlahKayu += 5;
                        pesan = '🪵 Kayu +5 (dengan kapak)';
                    } else {
                        jumlahKayu += 3;
                        pesan = '🪵 Kayu +3';
                    }
                    tambahXP(5);
                    return;
                }
            }

            for (let i = 0; i < batu.length; i++) {
                const b = batu[i];
                const jarak = Math.sqrt((playerX - b.x) ** 2 + (playerY - b.y) ** 2);
                if (jarak <= 30) {
                    batu.splice(i, 1);
                    jadwalkanRespawn('batu');
                    jumlahBatu += 2;
                    pesan = '🪨 Batu +2';
                    tambahXP(5);
                    return;
                }
            }

            for (let i = 0; i < semak.length; i++) {
                const s = semak[i];
                const jarak = Math.sqrt((playerX - s.x) ** 2 + (playerY - s.y) ** 2);
                if (jarak <= 30) {
                    semak.splice(i, 1);
                    jadwalkanRespawn('semak');
                    jumlahBerry += 2;
                    pesan = '🫐 Berry +2';
                    tambahXP(3);
                    return;
                }
            }
        }

        function makanBerry() {
            if (jumlahBerry > 0) {
                if (hunger < 100) {
                    hunger += 20;
                    if (hunger > 100) hunger = 100;
                    jumlahBerry--;
                    pesan = '🫐 Kamu makan berry (+20 hunger)';
                } else {
                    pesan = 'Hunger sudah penuh!';
                }
            } else {
                pesan = 'Kamu tidak punya berry!';
            }
        }

        function makanDaging() {
            if (jumlahDagingMasak > 0) {
                jumlahDagingMasak--;
                hunger += 25;
                if (hunger > 100) hunger = 100;
                pesan = '🍗 Kamu makan daging masak (+25 hunger)';
            } else if (jumlahDagingMentah > 0) {
                jumlahDagingMentah--;
                hunger += 15;
                if (hunger > 100) hunger = 100;
                if (Math.random() < 0.5) {
                    kesehatan -= 5;
                    if (kesehatan < 0) kesehatan = 0;
                    pesan = '🥩 Kamu makan daging mentah dan sakit (-5 health)';
                } else {
                    pesan = '🥩 Kamu makan daging mentah (+15 hunger)';
                }
            } else {
                pesan = 'Kamu tidak punya daging!';
            }
        }

        function berburuKelinci() {
            for (let i = 0; i < kelinci.length; i++) {
                const k = kelinci[i];
                const jarak = Math.sqrt((playerX - k.x) ** 2 + (playerY - k.y) ** 2);
                if (jarak <= 30) {
                    kelinci.splice(i, 1);
                    jadwalkanRespawn('kelinci');
                    jumlahDagingMentah += 2;
                    jumlahKulit += 1;
                    pesan = '🐇 Berhasil berburu kelinci! (+2 daging mentah, +1 kulit)';
                    tambahXP(10);
                    return;
                }
            }
            pesan = 'Tidak ada kelinci di dekatmu!';
        }

        function craftKapak() {
            if (punyaKapak) {
                pesan = 'Kamu sudah punya kapak!';
                return;
            }
            if (jumlahKayu >= 4 && jumlahBatu >= 2) {
                jumlahKayu -= 4;
                jumlahBatu -= 2;
                punyaKapak = true;
                pesan = '🪓 Berhasil membuat Kapak Batu!';
                tambahXP(15);
            } else {
                pesan = 'Bahan tidak cukup! Butuh 4 kayu dan 2 batu.';
            }
        }

        function buatCampfire() {
            if (jumlahKayu >= 5) {
                jumlahKayu -= 5;
                campfires.push({ x: playerX, y: playerY });
                pesan = '🔥 Campfire diletakkan di posisimu!';
                tambahXP(15);
            } else {
                pesan = 'Butuh 5 kayu untuk membuat campfire!';
            }
        }

        function masakDaging() {
            let dekatCampfire = false;
            for (let i = 0; i < campfires.length; i++) {
                const c = campfires[i];
                const jarak = Math.sqrt((playerX - c.x) ** 2 + (playerY - c.y) ** 2);
                if (jarak <= 50) {
                    dekatCampfire = true;
                    break;
                }
            }

            if (!dekatCampfire) {
                pesan = 'Kamu harus dekat dengan campfire untuk memasak!';
                return;
            }

            if (jumlahDagingMentah > 0) {
                jumlahDagingMentah--;
                jumlahDagingMasak++;
                pesan = '🍗 Daging mentah dimasak! (+1 daging masak)';
                tambahXP(5);
            } else {
                pesan = 'Kamu tidak punya daging mentah!';
            }
        }

        function serangMusuh() {
            let terdekat = null;
            let jarakTerdekat = 9999;

            for (let i = 0; i < musuh.length; i++) {
                const m = musuh[i];
                const jarak = Math.sqrt((playerX - m.x) ** 2 + (playerY - m.y) ** 2);
                if (jarak < 50 && jarak < jarakTerdekat) {
                    terdekat = i;
                    jarakTerdekat = jarak;
                }
            }

            if (terdekat !== null) {
                const damage = 10 + (level - 1) * 5;
                musuh[terdekat].hp -= damage;
                pesan = '⚔️ Kamu menyerang serigala! (-' + damage + ' HP)';
                if (musuh[terdekat].hp <= 0) {
                    pesan = '💀 Serigala mati!';
                    musuh.splice(terdekat, 1);
                    tambahXP(20);
                }
            } else {
                pesan = 'Tidak ada musuh di dekatmu!';
            }
        }

        function updateMusuh() {
            if (gameOver) return;

            musuh.forEach(function(m) {
                const oldX = m.x;
                const oldY = m.y;

                const jarakKePemain = Math.sqrt((playerX - m.x) ** 2 + (playerY - m.y) ** 2);

                let kelinciTerdekat = null;
                let jarakKeKelinci = Infinity;
                for (let i = 0; i < kelinci.length; i++) {
                    const k = kelinci[i];
                    const jarak = Math.sqrt((m.x - k.x) ** 2 + (m.y - k.y) ** 2);
                    if (jarak < jarakKeKelinci) {
                        jarakKeKelinci = jarak;
                        kelinciTerdekat = i;
                    }
                }

                let targetX = null;
                let targetY = null;
                let speed = 1.5;

                if (malam && jarakKePemain < 250) {
                    targetX = playerX;
                    targetY = playerY;
                } else if (kelinciTerdekat !== null && jarakKeKelinci < 200) {
                    const target = kelinci[kelinciTerdekat];
                    targetX = target.x;
                    targetY = target.y;
                    speed = 1.8;
                } else {
                    if (!malam && jarakKePemain < 120) {
                        const arahX = (m.x - playerX) / jarakKePemain;
                        const arahY = (m.y - playerY) / jarakKePemain;
                        m.x += arahX * 0.5;
                        m.y += arahY * 0.5;
                    }
                }

                if (targetX !== null && targetY !== null) {
                    const jarakKeTarget = Math.sqrt((targetX - m.x) ** 2 + (targetY - m.y) ** 2);
                    if (jarakKeTarget > 1) {
                        const arahX = (targetX - m.x) / jarakKeTarget;
                        const arahY = (targetY - m.y) / jarakKeTarget;
                        m.x += arahX * speed;
                        m.y += arahY * speed;
                    }
                }

                if (!isInsidePulau(m.x, m.y)) {
                    m.x = oldX;
                    m.y = oldY;
                }

                if (kelinciTerdekat !== null && jarakKeKelinci < 15) {
                    kelinci.splice(kelinciTerdekat, 1);
                    jadwalkanRespawn('kelinci');
                    m.hp = Math.min(m.hp + 10, 30);
                    pesan = '🐺 Serigala memakan kelinci!';
                }

                const jarakSekarang = Math.sqrt((playerX - m.x) ** 2 + (playerY - m.y) ** 2);

                if (malam && jarakSekarang < 25 && m.cooldown <= 0) {
                    kesehatan -= 5;
                    if (kesehatan < 0) kesehatan = 0;
                    pesan = '🐺 Kamu digigit serigala!';
                    m.cooldown = 10;

                    if (kesehatan === 0) {
                        gameOver = true;
                        pesan = 'Kamu mati diserang serigala...';
                    }
                }

                if (m.cooldown > 0) {
                    m.cooldown--;
                }
            });
        }

        function updateKelinci() {
            if (gameOver) return;

            kelinci.forEach(function(k) {
                const oldX = k.x;
                const oldY = k.y;

                k.timer++;
                if (k.timer > 50) {
                    const sudut = Math.random() * Math.PI * 2;
                    k.arahX = Math.cos(sudut);
                    k.arahY = Math.sin(sudut);
                    k.timer = 0;
                }

                const speed = 0.8;
                k.x += k.arahX * speed;
                k.y += k.arahY * speed;

                if (!isInsidePulau(k.x, k.y)) {
                    k.x = oldX;
                    k.y = oldY;
                    const sudut = Math.random() * Math.PI * 2;
                    k.arahX = Math.cos(sudut);
                    k.arahY = Math.sin(sudut);
                }
            });
        }

        function updateWaktu() {
            if (gameOver) return;

            jam += 0.01;
            if (jam >= 24) jam = 0;

            malam = jam >= 18 || jam < 6;
        }

        function jadwalkanRespawn(tipe) {
            let delay;
            if (tipe === 'pohon') delay = RESPAWN_DELAY_POHON;
            else if (tipe === 'batu') delay = RESPAWN_DELAY_BATU;
            else if (tipe === 'semak') delay = RESPAWN_DELAY_SEMAK;
            else if (tipe === 'kelinci') delay = RESPAWN_DELAY_KELINCI;

            respawnList.push({
                tipe: tipe,
                waktu: Date.now() + delay
            });
        }

        function cekRespawn() {
            const sekarang = Date.now();
            for (let i = respawnList.length - 1; i >= 0; i--) {
                const item = respawnList[i];
                if (sekarang >= item.waktu) {
                    const pos = randomPosisiDalamPulau();
                    if (item.tipe === 'pohon') {
                        pohon.push({ x: pos.x, y: pos.y });
                    } else if (item.tipe === 'batu') {
                        batu.push({ x: pos.x, y: pos.y });
                    } else if (item.tipe === 'semak') {
                        semak.push({ x: pos.x, y: pos.y });
                    } else if (item.tipe === 'kelinci') {
                        kelinci.push({
                            x: pos.x,
                            y: pos.y,
                            arahX: Math.random() * 2 - 1,
                            arahY: Math.random() * 2 - 1,
                            timer: Math.floor(Math.random() * 50)
                        });
                    }
                    respawnList.splice(i, 1);
                }
            }
        }

        // =====================
        // KONTROL
        // =====================

        document.addEventListener('keydown', function(event) {
            if (gameOver) {
                if (event.key === 'r' || event.key === 'R') {
                    restartGame();
                }
                return;
            }

            keys[event.key] = true;

            if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
                event.preventDefault();
            }

            if (event.key === 'e' || event.key === 'E') {
                kumpulkanResource();
            }

            if (event.key === 'c' || event.key === 'C') {
                craftKapak();
            }

            if (event.key === 'q' || event.key === 'Q') {
                makanBerry();
            }

            if (event.key === 't' || event.key === 'T') {
                makanDaging();
            }

            if (event.key === 'f' || event.key === 'F') {
                berburuKelinci();
            }

            if (event.key === 'b' || event.key === 'B') {
                buatCampfire();
            }

            if (event.key === 'r' || event.key === 'R') {
                // R sudah dipakai restart saat game over
            }

            if (event.key === 'p' || event.key === 'P') {
                simpanGame();
            }

            if (event.key === 'l' || event.key === 'L') {
                muatGame();
            }

            if (event.key === ' ') {
                serangMusuh();
            }
        });

        document.addEventListener('keyup', function(event) {
            keys[event.key] = false;
        });

        restartButton.addEventListener('click', restartGame);

        // =====================
        // GAME LOOP (requestAnimationFrame)
        // =====================

        function gameLoop(now) {
            if (!gameOver) {
                const deltaTime = Math.min((now - lastFrameTime) / 1000, 0.1);
                lastFrameTime = now;

                // ===== PERGERAKAN PEMAIN =====
                let dx = 0;
                let dy = 0;

                if (keys['w'] || keys['ArrowUp']) dy -= 1;
                if (keys['s'] || keys['ArrowDown']) dy += 1;
                if (keys['a'] || keys['ArrowLeft']) dx -= 1;
                if (keys['d'] || keys['ArrowRight']) dx += 1;

                if (dx !== 0 || dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length;
                    dy /= length;

                    const newX = playerX + dx * kecepatanPemain * deltaTime;
                    const newY = playerY + dy * kecepatanPemain * deltaTime;

                    if (isInsidePulau(newX, newY)) {
                        playerX = newX;
                        playerY = newY;
                    }
                }

                if (now - lastUpdateTime >= 100) {
                    updateWaktu();
                    updateMusuh();
                    updateKelinci();
                    cekRespawn();
                    lastUpdateTime = now;
                }

                if (now - lastHungerTime >= 2000) {
                    hunger -= (malam ? 3 : 2);
                    if (hunger < 0) hunger = 0;

                    if (hunger === 0) {
                        kesehatan -= 1;
                        if (kesehatan < 0) kesehatan = 0;
                        if (kesehatan === 0) {
                            gameOver = true;
                            pesan = 'Kamu mati kelaparan...';
                        }
                    }

                    lastHungerTime = now;
                }
            }

            render();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
