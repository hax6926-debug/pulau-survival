        // ===== UTILITY FUNCTIONS FOR UI CLICK DETECTION =====
        function getSlotIndexAt(x, y) {
            if (!gameState.showMenu) return -1;
            const cols = 8, rows = 3, slotSize = 48, gap = 6;
            const gridW = cols * slotSize + (cols - 1) * gap;
            const gridH = rows * slotSize + (rows - 1) * gap;
            const startX = (canvas.width - gridW) / 2;
            const startY = (canvas.height - gridH) / 2 - 20;
            for (let i = 0; i < gameState.slots.length; i++) {
                const col = i % cols, row = Math.floor(i / cols);
                const sx = startX + col * (slotSize + gap);
                const sy = startY + row * (slotSize + gap);
                if (x >= sx && x <= sx + slotSize && y >= sy && y <= sy + slotSize) return i;
            }
            return -1;
        }

        function getCraftingSlotAt(x, y) {
            if (!gameState.showMenu || gameState.craftingTableOpen) return -1;
            const cols = 8, rows = 3, slotSize = 48, gap = 6;
            const gridW = cols * slotSize + (cols - 1) * gap;
            const gridH = rows * slotSize + (rows - 1) * gap;
            const startX = (canvas.width - gridW) / 2;
            const startY = (canvas.height - gridH) / 2 - 20;
            const craftStartX = startX + gridW + 40;
            const craftStartY = startY;
            const craftSize = 48, craftGap = 6;
            for (let i = 0; i < 4; i++) {
                const col = i % 2, row = Math.floor(i / 2);
                const sx = craftStartX + col * (craftSize + craftGap);
                const sy = craftStartY + row * (craftSize + craftGap) + 10;
                if (x >= sx && x <= sx + craftSize && y >= sy && y <= sy + craftSize) return i;
            }
            return -1;
        }

        function getCraftingTableSlotAt(x, y) {
            if (!gameState.showMenu || !gameState.craftingTableOpen) return -1;
            const cols = 8, rows = 3, slotSize = 48, gap = 6;
            const gridW = cols * slotSize + (cols - 1) * gap;
            const gridH = rows * slotSize + (rows - 1) * gap;
            const startX = (canvas.width - gridW) / 2;
            const startY = (canvas.height - gridH) / 2 - 20;
            const tableStartX = startX + gridW + 40;
            const tableStartY = startY;
            const slotSizeTable = 48, gapTable = 6;
            for (let i = 0; i < 9; i++) {
                const col = i % 3, row = Math.floor(i / 3);
                const sx = tableStartX + col * (slotSizeTable + gapTable);
                const sy = tableStartY + row * (slotSizeTable + gapTable) + 10;
                if (x >= sx && x <= sx + slotSizeTable && y >= sy && y <= sy + slotSizeTable) return i;
            }
            return -1;
        }

        function getHotbarIndexAt(x, y) {
            if (gameState.showMenu) return -1;
            const slotSize = 42;
            const hotbarWidth = slotSize * 8 + 10;
            const startX = (canvas.width - hotbarWidth) / 2;
            const startY = canvas.height - slotSize - 15;
            for (let i = 0; i < 8; i++) {
                const sx = startX + i * slotSize, sy = startY;
                if (x >= sx && x <= sx + slotSize - 2 && y >= sy && y <= sy + slotSize - 2) return i;
            }
            return -1;
        }

        function isCloseButtonClicked(x, y) {
            if (!gameState.showMenu) return false;
            const cols = 8, rows = 3, slotSize = 48, gap = 6;
            const gridW = cols * slotSize + (cols - 1) * gap;
            const gridH = rows * slotSize + (rows - 1) * gap;
            const startX = (canvas.width - gridW) / 2;
            const startY = (canvas.height - gridH) / 2 - 20;
            const closeX = startX + gridW + 5, closeY = startY - 35;
            const closeRadius = 18;
            const dx = x - closeX, dy = y - closeY;
            return (dx*dx + dy*dy) <= closeRadius * closeRadius;
        }

        // ==========================================
        // INPUT CONTROLS
        // ==========================================

        window.addEventListener('keydown', (e) => {
            if (gameState.gameOver) {
                if (e.key === 'r' || e.key === 'R') gameState.restartGame();
                return;
            }
            gameState.keys[e.key] = true;
            if (gameState.player) gameState.player.keys = gameState.keys;

            if (e.key === 'e' || e.key === 'E') {
                interaksi();
            }
            if (e.key === 'Tab' || e.key === 'i' || e.key === 'I') {
                e.preventDefault();
                if (gameState.craftingTableOpen) {
                    closeCraftingTable();
                } else {
                    gameState.showMenu = !gameState.showMenu;
                }
            }
            if (e.key === 'k' || e.key === 'K') toggleMusic();
            if (e.key === 'h' || e.key === 'H') {
                hancurkanTerdekat();
            }
            if (e.key >= '1' && e.key <= '8') {
                gameState.selectedSlot = parseInt(e.key) - 1;
            }
            if (e.key === 'Escape' && gameState.craftingTableOpen) {
                closeCraftingTable();
            }
        });

        window.addEventListener('keyup', (e) => {
            gameState.keys[e.key] = false;
            if (gameState.player) gameState.player.keys = gameState.keys;
        });

        canvas.addEventListener('mousedown', (e) => {
            if (gameState.gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left, y = e.clientY - rect.top;
            
            if (gameState.showMenu) {
                if (isCloseButtonClicked(x, y)) {
                    if (gameState.craftingTableOpen) {
                        closeCraftingTable();
                    } else {
                        gameState.showMenu = false;
                    }
                    return;
                }

                if (gameState.craftingTableOpen && gameState.tableCloseBtn) {
                    const btn = gameState.tableCloseBtn;
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        closeCraftingTable();
                        return;
                    }
                }

                if (gameState.craftingTableOpen && gameState.craftTableBtn) {
                    const btn = gameState.craftTableBtn;
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        doCraft3x3();
                        return;
                    }
                }

                // === PERUBAHAN: Gunakan tryCraft2x2 ===
                if (!gameState.craftingTableOpen && gameState.craftBtn) {
                    const btn = gameState.craftBtn;
                    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                        console.log('Klik Craft 2x2 di', x, y); // DEBUG
                        tryCraft2x2();
                        return;
                    }
                }

                if (!gameState.craftingTableOpen) {
                    const craftIndex = getCraftingSlotAt(x, y);
                    if (craftIndex >= 0) {
                        const slot = gameState.craftingSlots[craftIndex];
                        if (slot) {
                            addItem(slot.id, slot.jumlah);
                            gameState.craftingSlots[craftIndex] = null;
                        } else {
                            const invSlot = gameState.slots[gameState.selectedSlot];
                            if (invSlot) {
                                gameState.craftingSlots[craftIndex] = { id: invSlot.id, jumlah: 1 };
                                removeItem(invSlot.id, 1);
                            }
                        }
                        return;
                    }
                }

                if (gameState.craftingTableOpen) {
                    const tableIndex = getCraftingTableSlotAt(x, y);
                    if (tableIndex >= 0) {
                        const slot = gameState.craftingTableSlots[tableIndex];
                        if (slot) {
                            addItem(slot.id, slot.jumlah);
                            gameState.craftingTableSlots[tableIndex] = null;
                            gameState.craftingTableResult = null;
                        } else {
                            const invSlot = gameState.slots[gameState.selectedSlot];
                            if (invSlot) {
                                gameState.craftingTableSlots[tableIndex] = { id: invSlot.id, jumlah: 1 };
                                removeItem(invSlot.id, 1);
                                gameState.craftingTableResult = matchRecipe3x3();
                            }
                        }
                        return;
                    }
                }

                const index = getSlotIndexAt(x, y);
                if (index >= 0 && gameState.slots[index]) {
                    gameState.isDragging = true;
                    gameState.dragItem = { ...gameState.slots[index] };
                    gameState.dragFromIndex = index;
                    gameState.slots[index] = null;
                }
            } else {
                const hotbarIndex = getHotbarIndexAt(x, y);
                if (hotbarIndex >= 0) {
                    gameState.selectedSlot = hotbarIndex;
                }
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            gameState.mouseX = e.clientX - rect.left;
            gameState.mouseY = e.clientY - rect.top;
            if (gameState.showMenu) {
                gameState.hoveredSlotIndex = getSlotIndexAt(gameState.mouseX, gameState.mouseY);
            }
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (gameState.isDragging && gameState.dragItem) {
                const index = getSlotIndexAt(gameState.mouseX, gameState.mouseY);
                if (index >= 0) {
                    const target = gameState.slots[index];
                    if (target && target.id === gameState.dragItem.id) {
                        const space = MAX_STACK - target.jumlah;
                        if (space >= gameState.dragItem.jumlah) {
                            target.jumlah += gameState.dragItem.jumlah;
                        } else {
                            target.jumlah = MAX_STACK;
                            gameState.slots[gameState.dragFromIndex] = {
                                id: gameState.dragItem.id,
                                jumlah: gameState.dragItem.jumlah - space
                            };
                        }
                    } else if (target) {
                        gameState.slots[gameState.dragFromIndex] = target;
                        gameState.slots[index] = gameState.dragItem;
                    } else {
                        gameState.slots[index] = gameState.dragItem;
                    }
                } else {
                    gameState.slots[gameState.dragFromIndex] = gameState.dragItem;
                }
                gameState.isDragging = false;
                gameState.dragItem = null;
                gameState.dragFromIndex = -1;
            }
        });

        // ===== TOUCH CONTROLS =====
        canvas.addEventListener('touchstart', (e) => {
            if (!audioCtx) initAudio();
            if (gameState.gameOver) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
                
                if (gameState.showMenu) {
                    if (isCloseButtonClicked(x, y)) {
                        if (gameState.craftingTableOpen) closeCraftingTable();
                        else gameState.showMenu = false;
                        continue;
                    }
                    if (gameState.craftingTableOpen && gameState.tableCloseBtn) {
                        const btn = gameState.tableCloseBtn;
                        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                            closeCraftingTable();
                            continue;
                        }
                    }
                    if (gameState.craftingTableOpen && gameState.craftTableBtn) {
                        const btn = gameState.craftTableBtn;
                        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                            doCraft3x3();
                            continue;
                        }
                    }
                    // === PERUBAHAN: Gunakan tryCraft2x2 ===
                    if (!gameState.craftingTableOpen && gameState.craftBtn) {
                        const btn = gameState.craftBtn;
                        if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                            console.log('Touch Craft 2x2 di', x, y); // DEBUG
                            tryCraft2x2();
                            continue;
                        }
                    }
                    if (!gameState.craftingTableOpen) {
                        const craftIndex = getCraftingSlotAt(x, y);
                        if (craftIndex >= 0) {
                            const slot = gameState.craftingSlots[craftIndex];
                            if (slot) { addItem(slot.id, slot.jumlah); gameState.craftingSlots[craftIndex] = null; }
                            else {
                                const invSlot = gameState.slots[gameState.selectedSlot];
                                if (invSlot) { gameState.craftingSlots[craftIndex] = { id: invSlot.id, jumlah: 1 }; removeItem(invSlot.id, 1); }
                            }
                            continue;
                        }
                    }
                    if (gameState.craftingTableOpen) {
                        const tableIndex = getCraftingTableSlotAt(x, y);
                        if (tableIndex >= 0) {
                            const slot = gameState.craftingTableSlots[tableIndex];
                            if (slot) { addItem(slot.id, slot.jumlah); gameState.craftingTableSlots[tableIndex] = null; gameState.craftingTableResult = null; }
                            else {
                                const invSlot = gameState.slots[gameState.selectedSlot];
                                if (invSlot) { gameState.craftingTableSlots[tableIndex] = { id: invSlot.id, jumlah: 1 }; removeItem(invSlot.id, 1); gameState.craftingTableResult = matchRecipe3x3(); }
                            }
                            continue;
                        }
                    }
                    const index = getSlotIndexAt(x, y);
                    if (index >= 0 && gameState.slots[index]) {
                        gameState.isDragging = true;
                        gameState.dragItem = { ...gameState.slots[index] };
                        gameState.dragFromIndex = index;
                        gameState.slots[index] = null;
                        gameState.mouseX = x; gameState.mouseY = y;
                    }
                    continue;
                }
                
                const hotbarIndex = getHotbarIndexAt(x, y);
                if (hotbarIndex >= 0) { gameState.selectedSlot = hotbarIndex; continue; }
                
                const screenW = canvas.width, screenH = canvas.height;
                const buttonRadius = 30;
                const startBtnX = screenW - buttonRadius - 20;
                const btn1Y = screenH - buttonRadius - 20;
                const btn2Y = btn1Y - 80;
                const btn3Y = btn2Y - 80;   // ← tambahan untuk tombol hancurkan
                
                const dInteraksi = Math.hypot(x - startBtnX, y - btn1Y);
                if (dInteraksi <= buttonRadius * 1.5) { interaksi(); continue; }
                
                const dMenu = Math.hypot(x - startBtnX, y - btn2Y);
                if (dMenu <= buttonRadius * 1.5) { 
                    if (gameState.craftingTableOpen) {
                        closeCraftingTable();
                    } else {
                        gameState.showMenu = true;
                    }
                    continue; 
                }
                
                const dDestroy = Math.hypot(x - startBtnX, y - btn3Y);
                if (dDestroy <= buttonRadius * 1.5) { 
                    hancurkanTerdekat(); 
                    continue; 
                }
                
                if (x < screenW / 2 && !gameState.joystickActive) {
                    gameState.joystickActive = true;
                    gameState.joystickTouchId = touch.identifier;
                    gameState.joystickBaseX = x;
                    gameState.joystickBaseY = y;
                    gameState.joystickX = 0; gameState.joystickY = 0;
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
                if (gameState.showMenu && gameState.isDragging) {
                    gameState.mouseX = x; gameState.mouseY = y;
                    continue;
                }
                if (gameState.joystickActive && touch.identifier === gameState.joystickTouchId) {
                    const dx = x - gameState.joystickBaseX, dy = y - gameState.joystickBaseY;
                    const distance = Math.hypot(dx, dy);
                    const maxDist = 50;
                    if (distance < maxDist) {
                        gameState.joystickX = dx / maxDist;
                        gameState.joystickY = dy / maxDist;
                    } else {
                        gameState.joystickX = dx / distance;
                        gameState.joystickY = dy / distance;
                    }
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (gameState.showMenu && gameState.isDragging) {
                    const x = touch.clientX - rect.left, y = touch.clientY - rect.top;
                    const index = getSlotIndexAt(x, y);
                    if (index >= 0) {
                        const target = gameState.slots[index];
                        if (target && target.id === gameState.dragItem.id) {
                            const space = MAX_STACK - target.jumlah;
                            if (space >= gameState.dragItem.jumlah) {
                                target.jumlah += gameState.dragItem.jumlah;
                            } else {
                                target.jumlah = MAX_STACK;
                                gameState.slots[gameState.dragFromIndex] = {
                                    id: gameState.dragItem.id,
                                    jumlah: gameState.dragItem.jumlah - space
                                };
                            }
                        } else if (target) {
                            gameState.slots[gameState.dragFromIndex] = target;
                            gameState.slots[index] = gameState.dragItem;
                        } else {
                            gameState.slots[index] = gameState.dragItem;
                        }
                    } else {
                        gameState.slots[gameState.dragFromIndex] = gameState.dragItem;
                    }
                    gameState.isDragging = false;
                    gameState.dragItem = null;
                    gameState.dragFromIndex = -1;
                }
                if (gameState.joystickActive && touch.identifier === gameState.joystickTouchId) {
                    gameState.joystickActive = false;
                    gameState.joystickTouchId = -1;
                    gameState.joystickX = 0; gameState.joystickY = 0;
                    // Reset tombol agar karakter berhenti
                    gameState.keys['w'] = false;
                    gameState.keys['a'] = false;
                    gameState.keys['s'] = false;
                    gameState.keys['d'] = false;
                    updateKeysFromJoystick();
                }
            }
        });

        restartButton.addEventListener('click', () => { gameState.restartGame(); });
        window.addEventListener('click', () => { if (!audioCtx) initAudio(); }, { once: true });

        // ==========================================
        // GAME LOOP
        // ==========================================
        
        function gameLoop(timestamp) {
            const deltaTime = (timestamp - gameState.lastFrameTime) / 1000;
            gameState.lastFrameTime = timestamp;

            frameCount++;
            if (timestamp - fpsTime >= 1000) { fps = frameCount; frameCount = 0; fpsTime = timestamp; }

            if (!gameState.gameOver) {
                if (!gameState.showMenu) {
                    updateKeysFromJoystick(); // Pindahkan ke sini agar lebih responsif
                    gameState.player.update(deltaTime);
                    gameState.enemies.forEach(e => e.update(gameState));
                    gameState.kelincis.forEach(k => k.update(gameState));
                    updateWaktu(deltaTime);
                    gameState.cekRespawn();

                    if (timestamp - gameState.lastHungerTime > 5000) {
                        gameState.hunger -= 1;
                        if (gameState.hunger < 0) gameState.hunger = 0;
                        if (gameState.hunger === 0) {
                            gameState.kesehatan -= 5;
                            gameState.pesan = '⚠️ Kamu kelaparan! (-5 HP)';
                            playSound('hurt');
                            if (gameState.kesehatan <= 0) {
                                gameState.kesehatan = 0;
                                gameState.gameOver = true;
                                gameState.pesan = '💀 Kamu mati kelaparan...';
                            }
                        }
                        gameState.lastHungerTime = timestamp;
                    }
                    gameState.floatingTexts = gameState.floatingTexts.filter(ft => {
                        ft.y -= ft.vy * deltaTime;
                        ft.life -= deltaTime;
                        return ft.life > 0;
                    });
                }
            }
            render();
            requestAnimationFrame(gameLoop);
        }

        function updateWaktu(deltaTime) {
            if (gameState.gameOver) return;
            gameState.jam += deltaTime * 0.08;
            if (gameState.jam >= 24) gameState.jam = 0;
            gameState.malam = gameState.jam >= 18 || gameState.jam < 6;
        }

        // Mulai Game
        gameState.restartGame();
        requestAnimationFrame(gameLoop);

    </script>
</body>
