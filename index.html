<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulau Survival</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #87CEEB;
            max-width: 100vw;
            max-height: 100vh;
            width: auto;
            height: auto;
        }
        #restartButton {
            display: none;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-size: 20px;
            background: #FF5722;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <button id="restartButton">Main Lagi</button>
    
    <script>
        // ==========================================
        // INISIALISASI CANVAS & VARIABEL DUNIA
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartButton = document.getElementById('restartButton');
        
        // Variabel untuk menghitung FPS
let fps = 0;
let frameCount = 0;
let fpsTime = 0;

        // Ukuran dunia
        const worldWidth = 1600;
        const worldHeight = 1600;

        // Generate bentuk pulau organik yang TETAP (deterministik)
        const pulauPoints = [];
        const jumlahSegmen = 16;
        const radiusDasar = 650;
        
        for (let i = 0; i < jumlahSegmen; i++) {
            const sudut = (i / jumlahSegmen) * Math.PI * 2;
            const variasi = Math.sin(i * 1.5) * 30 + Math.cos(i * 2) * 20;
            const r = radiusDasar + variasi;
            const x = worldWidth / 2 + Math.cos(sudut) * r;
            const y = worldHeight / 2 + Math.sin(sudut) * r;
            pulauPoints.push({ x, y });
        }

        // ==========================================
        // FUNGSI UTILITY (ALAT BANTU)
        // ==========================================
        
        // Cek apakah titik berada di dalam pulau
        function isInsidePulau(x, y) {
            let inside = false;
            for (let i = 0, j = pulauPoints.length - 1; i < pulauPoints.length; j = i++) {
                const xi = pulauPoints[i].x;
                const yi = pulauPoints[i].y;
                const xj = pulauPoints[j].x;
                const yj = pulauPoints[j].y;
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        // Dapatkan posisi acak di dalam pulau
        function randomPosisiDalamPulau() {
            let x, y;
            do {
                x = Math.random() * (worldWidth - 100) + 50;
                y = Math.random() * (worldHeight - 100) + 50;
            } while (!isInsidePulau(x, y));
            return { x, y };
        }
        
        // Cek apakah pemain menabrak objek (pohon/batu/semak/campfire)
        function isBlocked(x, y) {
    const obstacles = [...gameState.resources, ...gameState.campfires, ...gameState.walls];
    for (let obs of obstacles) {
        const dx = x - obs.x;
        const dy = y - obs.y;
        const jarak = Math.sqrt(dx * dx + dy * dy);
        if (jarak < 15) {
            return true;
        }
    }
    return false;
}

        // ==========================================
        // CLASS DEFINITIONS (CETAKAN OBJEK)
        // ==========================================

        class Entity {
            constructor(x, y) {
                this.x = x;
                this.y = y;
            }
        }

        class Player extends Entity {
           constructor() {
    super(worldWidth / 2, worldHeight / 2);
    this.size = 20;
    this.kecepatan = 150;
    this.lastDirX = 0;
    this.lastDirY = 1;
    this.keys = {};
    this.hurtUntil = 0;
    this.isMoving = false;
    this.walkTime = 0;
    this.slowUntil = 0;
}

            update(deltaTime) {
                let dx = 0;
                let dy = 0;

                if (this.keys['w'] || this.keys['ArrowUp']) dy -= 1;
                if (this.keys['s'] || this.keys['ArrowDown']) dy += 1;
                if (this.keys['a'] || this.keys['ArrowLeft']) dx -= 1;
                if (this.keys['d'] || this.keys['ArrowRight']) dx += 1;

                this.isMoving = dx !== 0 || dy !== 0;

if (this.isMoving) {
    const length = Math.sqrt(dx * dx + dy * dy);
    dx /= length;
    dy /= length;

    this.lastDirX = dx;
    this.lastDirY = dy;

    // Update waktu untuk animasi berjalan
    this.walkTime += deltaTime;

   let kecepatanSekarang = this.kecepatan;
if (performance.now() < this.slowUntil) {
    kecepatanSekarang = this.kecepatan * 0.5; // 50% lebih lambat
}

const newX = this.x + dx * kecepatanSekarang * deltaTime;
const newY = this.y + dy * kecepatanSekarang * deltaTime;

    // Coba gerakkan sumbu X dulu
    if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
        this.x = newX;
    }

    // Lalu coba sumbu Y
    if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
        this.y = newY;
    }
} else {
    // Reset animasi saat diam
    this.walkTime = 0;
}
            }

            draw() {
                const x = this.x;
                const y = this.y;

                // Outline
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                const hurt = performance.now() < this.hurtUntil;
                const warnaBadan = hurt ? '#E74C3C' : '#4A90D9';
                const warnaKulit = hurt ? '#FF6B6B' : '#FFD1A6';

                // Badan (oval)
                ctx.fillStyle = warnaBadan;
                ctx.beginPath();
                ctx.ellipse(x, y, 7, 8, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Kepala
                ctx.fillStyle = warnaKulit;
                ctx.beginPath();
                ctx.arc(x, y - 12, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // ===== ANIMASI LENGAN =====
const sway = this.isMoving ? Math.sin(this.walkTime * 12) * 2 : 0;
const isHorizontal = Math.abs(this.lastDirX) > Math.abs(this.lastDirY);

if (this.isMoving && isHorizontal) {
    // Saat bergerak horizontal, hanya satu lengan terlihat (di sisi arah gerak)
    const side = this.lastDirX > 0 ? 1 : -1; // 1 = kanan, -1 = kiri
    const handX = x + side * 6; // agak ke tengah
    const handY = y - 2 + sway;

    ctx.fillStyle = warnaKulit;
    ctx.beginPath();
    ctx.arc(handX, handY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
} else {
    // Saat diam atau bergerak vertikal, gambar dua lengan
    const leftHandX = x - 8;
    const leftHandY = y - 2 + sway;
    const rightHandX = x + 8;
    const rightHandY = y - 2 - sway;

    // Tangan kiri
    ctx.fillStyle = warnaKulit;
    ctx.beginPath();
    ctx.arc(leftHandX, leftHandY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Tangan kanan
    ctx.beginPath();
    ctx.arc(rightHandX, rightHandY, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
}
                
                // Mata
const mataX = x + this.lastDirX * 2;
const mataY = y - 12 + this.lastDirY * 2;
ctx.fillStyle = '#111';
ctx.beginPath();
ctx.arc(mataX, mataY, 1.2, 0, Math.PI * 2);
ctx.fill();

// Mulut
ctx.fillRect(x - 1.5, y - 9, 3, 1);
            }
        }

        class Resource extends Entity {
    constructor(x, y, tipe) {
        super(x, y);
        this.tipe = tipe; // 'pohon', 'batu', 'semak'
    }
    
    draw() {
        // Outline hitam
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1.5;
        
        if (this.tipe === 'pohon') {
            // Batang pohon
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(this.x - 4, this.y - 10, 8, 20);
            ctx.strokeRect(this.x - 4, this.y - 10, 8, 20);
            
            // Daun pohon
            ctx.fillStyle = '#27AE60';
            ctx.beginPath();
            ctx.arc(this.x, this.y - 15, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (this.tipe === 'batu') {
            // Batu besar
            ctx.fillStyle = '#7F8C8D';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Highlight batu
            ctx.fillStyle = '#95A5A6';
            ctx.beginPath();
            ctx.arc(this.x - 3, this.y - 3, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        } else if (this.tipe === 'semak') {
            // Daun semak
            ctx.fillStyle = '#2ECC71';
            ctx.beginPath();
            ctx.arc(this.x, this.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Berry-berry merah
            ctx.fillStyle = '#FF0000';
            const berries = [
                { x: this.x - 4, y: this.y - 4 },
                { x: this.x + 4, y: this.y - 3 },
                { x: this.x, y: this.y + 5 }
            ];
            berries.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            });
        }
    }
}

       class Enemy extends Entity {
    constructor(x, y) {
        super(x, y);
        this.hp = 20;
        this.cooldown = 0;
        this.speed = 1.5;
        this.targetType = null;
        this.arahX = Math.random() * 2 - 1; // arah gerak idle
        this.arahY = Math.random() * 2 - 1;
    }

            update(gameState) {
                if (gameState.gameOver) return;

                const oldX = this.x;
                const oldY = this.y;
                const jarakKePemain = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);

                // Cari kelinci terdekat
                let kelinciTerdekat = null;
                let jarakKeKelinci = Infinity;
                
                for (let i = 0; i < gameState.kelincis.length; i++) {
                    const k = gameState.kelincis[i];
                    const jarak = Math.sqrt((this.x - k.x) ** 2 + (this.y - k.y) ** 2);
                    if (jarak < jarakKeKelinci) {
                        jarakKeKelinci = jarak;
                        kelinciTerdekat = i;
                    }
                }

                let targetX = null;
                let targetY = null;
                let speed = this.speed;

                if (gameState.malam && jarakKePemain < 250) {
                    targetX = gameState.player.x;
                    targetY = gameState.player.y;
                } else if (kelinciTerdekat !== null && jarakKeKelinci < 200) {
                    const target = gameState.kelincis[kelinciTerdekat];
                    targetX = target.x;
                    targetY = target.y;
                    speed = 1.8;
                } else {
    if (!gameState.malam && jarakKePemain < 120) {
        // Menghindar dari pemain saat siang
        const arahX = (this.x - gameState.player.x) / jarakKePemain;
        const arahY = (this.y - gameState.player.y) / jarakKePemain;
        
        const newX = this.x + arahX * 0.5;
        const newY = this.y + arahY * 0.5;
        
        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
            this.x = newX;
        }
        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
            this.y = newY;
        }
    } else {
        // Idle movement saat siang tanpa target dan tidak dekat pemain
        if (!gameState.malam) {
            const oldIdleX = this.x;
            const oldIdleY = this.y;
            
            this.x += this.arahX * 0.3;
            this.y += this.arahY * 0.3;
            
            if (!isInsidePulau(this.x, this.y) || isBlocked(this.x, this.y)) {
                // Kembalikan posisi dan berbalik arah ke dalam pulau
                this.x = oldIdleX;
                this.y = oldIdleY;
                this.ubahArahKeDalam();
            }
        }
    }
}

                if (targetX !== null && targetY !== null) {
                    const jarakKeTarget = Math.sqrt((targetX - this.x) ** 2 + (targetY - this.y) ** 2);
                    if (jarakKeTarget > 1) {
                        const arahX = (targetX - this.x) / jarakKeTarget;
                        const arahY = (targetY - this.y) / jarakKeTarget;

                        const newX = this.x + arahX * speed;
                        const newY = this.y + arahY * speed;

                        // Coba sumbu X dulu
                        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
                            this.x = newX;
                        }

                        // Lalu sumbu Y
                        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
                            this.y = newY;
                        }
                    }
                }

               if (!isInsidePulau(this.x, this.y)) {
    this.x = oldX;
    this.y = oldY;
    this.ubahArahKeDalam(); // berbalik arah ke dalam pulau
}

                if (kelinciTerdekat !== null && jarakKeKelinci < 15) {
                    gameState.kelincis.splice(kelinciTerdekat, 1);
                    gameState.jadwalkanRespawn('kelinci');
                    this.hp = Math.min(this.hp + 10, 30);
                    gameState.pesan = '🐺 Serigala memakan kelinci!';
                }

                const jarakSekarang = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);

                if (gameState.malam && jarakSekarang < 25 && this.cooldown <= 0) {
    gameState.kesehatan -= 5;
    if (gameState.kesehatan < 0) gameState.kesehatan = 0;
    gameState.pesan = '🐺 Kamu digigit serigala!';
    this.cooldown = 10;
    
    // Efek terluka dan layar bergetar
    gameState.screenShakeUntil = performance.now() + 150;
    if (gameState.player) {
        gameState.player.hurtUntil = performance.now() + 200;
        gameState.player.slowUntil = performance.now() + 3000; // <-- di sini
    }
    
    if (gameState.kesehatan === 0) {
        gameState.gameOver = true;
        gameState.pesan = 'Kamu mati diserang serigala...';
    }
}

                if (this.cooldown > 0) {
                    this.cooldown--;
                }
            }
            
            ubahArahKeDalam() {
    const pusatX = worldWidth / 2;
    const pusatY = worldHeight / 2;
    const dx = pusatX - this.x;
    const dy = pusatY - this.y;
    const jarak = Math.sqrt(dx * dx + dy * dy) || 1;
    const sudut = Math.atan2(dy, dx) + (Math.random() - 0.5) * Math.PI / 3; // variasi ±60 derajat
    this.arahX = Math.cos(sudut);
    this.arahY = Math.sin(sudut);
}

            draw() {
                const x = this.x;
                const y = this.y;

                // Outline hitam
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                // Badan
                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Kepala
                ctx.fillStyle = '#95A5A6';
                ctx.beginPath();
                ctx.arc(x + 8, y - 5, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Mata
                ctx.fillStyle = '#FF0000';
                ctx.beginPath();
                ctx.arc(x + 9, y - 7, 2, 0, Math.PI * 2);
                ctx.fill();

                // Ekor
                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath();
                ctx.arc(x - 12, y + 5, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        class Kelinci extends Entity {
            constructor(x, y) {
                super(x, y);
                this.arahX = Math.random() * 2 - 1;
                this.arahY = Math.random() * 2 - 1;
                this.timer = Math.floor(Math.random() * 50);
            }

            update(gameState) {
    if (gameState.gameOver) return;

    this.timer++;
    if (this.timer > 50) {
        this.ubahArahAcak();
        this.timer = 0;
    }

    const speed = 0.8;

    // Coba gerakkan sumbu X dulu
    const newX = this.x + this.arahX * speed;
if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) {
    this.x = newX;
} else {
    this.ubahArahAcak(true); // berbalik menjauhi laut
}

const newY = this.y + this.arahY * speed;
if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) {
    this.y = newY;
} else {
    this.ubahArahAcak(true);
}
}

// Tambahkan method ini di dalam class Kelinci
ubahArahAcak(jauhiLaut = false) {
    if (jauhiLaut) {
        // Arah ke pusat pulau + variasi acak
        const pusatX = worldWidth / 2;
        const pusatY = worldHeight / 2;
        const dx = pusatX - this.x;
        const dy = pusatY - this.y;
        const jarak = Math.sqrt(dx * dx + dy * dy) || 1;
        const sudutDasar = Math.atan2(dy, dx);
        const sudut = sudutDasar + (Math.random() - 0.5) * Math.PI / 2; // variasi ±45 derajat
        this.arahX = Math.cos(sudut);
        this.arahY = Math.sin(sudut);
    } else {
        const sudut = Math.random() * Math.PI * 2;
        this.arahX = Math.cos(sudut);
        this.arahY = Math.sin(sudut);
    }
    this.timer = 0;
}

            draw() {
                const x = this.x;
                const y = this.y;

                // Outline hitam
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;

                // Badan
                ctx.fillStyle = '#D2B48C';
                ctx.beginPath();
                ctx.arc(x, y, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Kepala
                ctx.fillStyle = '#DEB887';
                ctx.beginPath();
                ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Telinga
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x + 3, y - 12, 2, 6);
                ctx.fillRect(x + 6, y - 12, 2, 6);

                // Ekor
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.arc(x - 8, y + 2, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }
        }

        class Campfire extends Entity {
              draw() {
    // Outline hitam
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;

    // Kayu bakar
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(this.x - 8, this.y, 16, 4);
    ctx.strokeRect(this.x - 8, this.y, 16, 4);
    ctx.fillRect(this.x - 4, this.y - 6, 16, 4);
    ctx.strokeRect(this.x - 4, this.y - 6, 16, 4);

    // Api
    ctx.fillStyle = '#FF4500';
    ctx.beginPath();
    ctx.arc(this.x, this.y - 4, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Inti api
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(this.x, this.y - 5, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
}
        }
        
        class Wall extends Entity {
    draw() {
        // Outline hitam
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 2;

        // Blok dinding (kotak)
        ctx.fillStyle = '#A0522D';
        ctx.fillRect(this.x - 10, this.y - 10, 20, 20);
        ctx.strokeRect(this.x - 10, this.y - 10, 20, 20);

        // Garis papan
        ctx.strokeStyle = '#8B4513';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(this.x - 10, this.y - 3);
        ctx.lineTo(this.x + 10, this.y - 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x - 10, this.y + 3);
        ctx.lineTo(this.x + 10, this.y + 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 10);
        ctx.lineTo(this.x, this.y + 10);
        ctx.stroke();
    }
}

        // ==========================================
        // GAME STATE (Pusat Data Game)
        // ==========================================

        const gameState = {
            player: null,
            resources: [],
            enemies: [],
            kelincis: [],
            campfires: [],
            walls: [],
            respawnList: [],

            jumlahKayu: 0,
            jumlahBatu: 0,
            jumlahBerry: 0,
            jumlahDagingMentah: 0,
            jumlahDagingMasak: 0,
            jumlahKulit: 0,
            punyaKapak: false,
            pesan: '',

            xp: 0,
            level: 1,
            xpPerLevel: 50,

            hunger: 100,
            kesehatan: 100,
            gameOver: false,

            jam: 8,
            malam: false,

            lastUpdateTime: performance.now(),
            lastHungerTime: performance.now(),
            lastFrameTime: performance.now(),

            keys: {},
            showMenu: false,

            screenShakeUntil: 0,
            screenShakeIntensity: 5,

            RESPAWN_DELAY: {
                pohon: 120000,
                batu: 120000,
                semak: 90000,
                kelinci: 90000,
                serigala: 180000
            },

            jadwalkanRespawn(tipe) {
                this.respawnList.push({
                    tipe: tipe,
                    waktu: Date.now() + this.RESPAWN_DELAY[tipe]
                });
            },

            cekRespawn() {
    const sekarang = Date.now();
    for (let i = this.respawnList.length - 1; i >= 0; i--) {
        const item = this.respawnList[i];
        if (sekarang >= item.waktu) {
            const pos = randomPosisiDalamPulau();
            if (item.tipe === 'pohon') {
                this.resources.push(new Resource(pos.x, pos.y, 'pohon'));
            } else if (item.tipe === 'batu') {
                this.resources.push(new Resource(pos.x, pos.y, 'batu'));
            } else if (item.tipe === 'semak') {
                this.resources.push(new Resource(pos.x, pos.y, 'semak'));
            } else if (item.tipe === 'kelinci') {
                this.kelincis.push(new Kelinci(pos.x, pos.y));
            } else if (item.tipe === 'serigala') {
                this.enemies.push(new Enemy(pos.x, pos.y));
            }
            this.respawnList.splice(i, 1);
        }
    }
},

            simpanGame() {
                try {
                    const data = {
                        playerX: this.player.x,
                        playerY: this.player.y,
                        jumlahKayu: this.jumlahKayu,
                        jumlahBatu: this.jumlahBatu,
                        jumlahBerry: this.jumlahBerry,
                        jumlahDagingMentah: this.jumlahDagingMentah,

        function gambarPulau() {
            ctx.fillStyle = '#F4D03F';
            ctx.beginPath();
            const first = pulauPoints[0];
            ctx.moveTo(first.x, first.y);

            for (let i = 1; i < pulauPoints.length; i++) {
                const prev = pulauPoints[i - 1];
                const curr = pulauPoints[i];
                const midX = (prev.x + curr.x) / 2;
                const midY = (prev.y + curr.y) / 2;
                ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
            }

            const last = pulauPoints[pulauPoints.length - 1];
            const firstAgain = pulauPoints[0];
            const midX = (last.x + firstAgain.x) / 2;
            const midY = (last.y + firstAgain.y) / 2;
            ctx.quadraticCurveTo(last.x, last.y, midX, midY);

            ctx.closePath();
            ctx.fill();
        }

}

        function interaksi() {
            const player = gameState.player;

            // ===== 1. Cari musuh terdekat (jarak serang 50) =====
            let musuhTerdekat = null;
            let jarakMusuh = Infinity;
            for (let i = 0; i < gameState.enemies.length; i++) {
                const m = gameState.enemies[i];
                const d = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);
                if (d < jarakMusuh) {
                    jarakMusuh = d;
                    musuhTerdekat = i;
                }
            }

           if (musuhTerdekat !== null && jarakMusuh < 50) {
    const damage = 10 + (gameState.level - 1) * 5;
    gameState.enemies[musuhTerdekat].hp -= damage;
    gameState.pesan = '⚔️ Kamu menyerang serigala! (-' + damage + ' HP)';
    if (gameState.enemies[musuhTerdekat].hp <= 0) {
        gameState.pesan = '💀 Serigala mati!';
        gameState.enemies.splice(musuhTerdekat, 1);
        gameState.jadwalkanRespawn('serigala');   // <-- tambahkan ini
        tambahXP(20);
    }
    return;
}

            // ===== 2. Cari kelinci terdekat (jarak buru 30) =====
            let kelinciTerdekat = null;
            let jarakKelinci = Infinity;
            for (let i = 0; i < gameState.kelincis.length; i++) {
                const k = gameState.kelincis[i];
                const d = Math.sqrt((player.x - k.x) ** 2 + (player.y - k.y) ** 2);
                if (d < jarakKelinci) {
                    jarakKelinci = d;
                    kelinciTerdekat = i;
                }
            }

            if (kelinciTerdekat !== null && jarakKelinci <= 30) {
                gameState.kelincis.splice(kelinciTerdekat, 1);
                gameState.jadwalkanRespawn('kelinci');
                gameState.jumlahDagingMentah += 2;
                gameState.jumlahKulit += 1;
                gameState.pesan = '🐇 Berhasil berburu kelinci! (+2 daging mentah, +1 kulit)';
                tambahXP(10);
                return;
            }

            // ===== 3. Cari resource terdekat (jarak kumpul 30) =====
            let resourceTerdekat = null;
            let jarakResource = Infinity;
            for (let i = 0; i < gameState.resources.length; i++) {
                const r = gameState.resources[i];
                const d = Math.sqrt((player.x - r.x) ** 2 + (player.y - r.y) ** 2);
                if (d < jarakResource) {
                    jarakResource = d;
                    resourceTerdekat = i;
                }
            }

            if (resourceTerdekat !== null && jarakResource <= 30) {
                const r = gameState.resources[resourceTerdekat];
                const tipe = r.tipe;
                gameState.resources.splice(resourceTerdekat, 1);
                gameState.jadwalkanRespawn(tipe);

                if (tipe === 'pohon') {
                    if (gameState.punyaKapak) {
                        gameState.jumlahKayu += 5;
                        gameState.pesan = '🪵 Kayu +5 (dengan kapak)';
                    } else {
                        gameState.jumlahKayu += 3;
                        gameState.pesan = '🪵 Kayu +3';
                    }
                } else if (tipe === 'batu') {
                    gameState.jumlahBatu += 2;
                    gameState.pesan = '🪨 Batu +2';
                } else if (tipe === 'semak') {
                    gameState.jumlahBerry += 2;
                    gameState.pesan = '🫐 Berry +2';
                }
                tambahXP(5);
                return;
            }

            // Tidak ada objek interaksi di dekat pemain
            gameState.pesan = 'Tidak ada objek di dekatmu.';
        }

        document.addEventListener('keydown', function(event) {
            // Toggle menu inventory/crafting
            if (event.key === 'Tab') {
                event.preventDefault();
                gameState.showMenu = !gameState.showMenu;
                return;
            }
            if (event.key === 'i' || event.key === 'I') {
                gameState.showMenu = !gameState.showMenu;
                return;
            }

            if (gameState.gameOver) {
                if (event.key === 'r' || event.key === 'R') {
                    gameState.restartGame();
                }
                return;
            }

            gameState.keys[event.key] = true;

            // Cegah layar ikut scrolling saat main pakai keyboard
            if (['w', 'a', 's', 'd', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) {
                event.preventDefault();
            }

            if (event.key === 'e' || event.key === 'E') {
                interaksi();
            }

            if (event.key === ' ') {
                event.preventDefault();
                interaksi();
            }

            if (event.key === 'c' || event.key === 'C') {
                craftKapak();
            }

            if (event.key === 'q' || event.key === 'Q') {
                makanBerry();
            }

            if (event.key === 't' || event.key === 'T') {
                makanDaging();
            }

            if (event.key === 'b' || event.key === 'B') {
                buatCampfire();
            }
            
            if (event.key === 'm' || event.key === 'M') {
    buatMedkit();
}

if (event.key === 'h' || event.key === 'H') {
    gunakanMedkit();
}

            if (event.key === 'n' || event.key === 'N') {
    buatDinding();
}

            if (event.key === 'p' || event.key === 'P') {
                gameState.simpanGame();
            }

            if (event.key === 'l' || event.key === 'L') {
                gameState.muatGame();
            }
        });

        document.addEventListener('keyup', function(event) {
            gameState.keys[event.key] = false;
        });

        restartButton.addEventListener('click', function() {
            gameState.restartGame();
        });

        // ==========================================
        // GAME LOOP UTAMA
        // ==========================================

        function gameLoop(now) {
            if (!gameState.gameOver) {
                // Delta time (waktu jeda antar frame)
                const deltaTime = Math.min((now - gameState.lastFrameTime) / 1000, 0.1);
                gameState.lastFrameTime = now;
                
                // Hitung FPS
frameCount++;
fpsTime += deltaTime;
if (fpsTime >= 0.5) {
    fps = frameCount / fpsTime;
    frameCount = 0;
    fpsTime = 0;
}

                // Update pergerakan pemain
                gameState.player.keys = gameState.keys;
                gameState.player.update(deltaTime);

                // Update logika lainnya setiap 100ms untuk performa
                if (now - gameState.lastUpdateTime >= 100) {
                    updateWaktu();
                    gameState.enemies.forEach(e => e.update(gameState));
                    gameState.kelincis.forEach(k => k.update(gameState));
                    gameState.cekRespawn();
                    gameState.lastUpdateTime = now;
                }

                // Update rasa lapar setiap 2000ms (2 detik)
                if (now - gameState.lastHungerTime >= 2000) {
                    gameState.hunger -= (gameState.malam ? 3 : 2); // Lapar lebih cepat saat malam
                    if (gameState.hunger < 0) gameState.hunger = 0;

                    if (gameState.hunger === 0) {
                        gameState.kesehatan -= 1;
                        if (gameState.kesehatan < 0) gameState.kesehatan = 0;
                        if (gameState.kesehatan === 0) {
                            gameState.gameOver = true;
                            gameState.pesan = 'Kamu mati kelaparan...';
                        }
                    }

                    gameState.lastHungerTime = now;
                }
            }

            render();

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // MULAI GAME
        // ==========================================
        
        // Inisialisasi awal
        gameState.restartGame();
        gameState.player.keys = gameState.keys;

        // Panggil putaran game pertama kali
        requestAnimationFrame(gameLoop);
        
    </script>
</body>
</html>
