<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pulau Survival</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        
        #rotateMessage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            font-size: 24px;
            text-align: center;
            justify-content: center;
            align-items: center;
            z-index: 100;
            flex-direction: column;
        }

        @media (orientation: portrait) {
            #rotateMessage {
                display: flex;
            }
        }
        
        #restartButton {
            display: none;
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 24px;
            font-size: 20px;
            background: #FF5722;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button id="restartButton">Main Lagi</button>
    
    <div id="rotateMessage">
        📱 Putar HP kamu ke mode landscape (miring)
    </div>
    
    <script>
        // ==========================================
        // INISIALISASI CANVAS & RESIZE LISTENER
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const restartButton = document.getElementById('restartButton');
        
        function resizeCanvas() {
            const maxWidth = 1200;
            const maxHeight = 800;
            canvas.width = Math.min(window.innerWidth, maxWidth);
            canvas.height = Math.min(window.innerHeight, maxHeight);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let fps = 0;
        let frameCount = 0;
        let fpsTime = 0;
        
        // Audio
        let audioCtx = null;
        let musicOsc1 = null;
        let musicOsc2 = null;
        let musicGain = null;
        let musicEnabled = true;
        let musicMelodyInterval = null;
        let musicStarted = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!musicStarted && musicEnabled) startMusic();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            let freq = 200, durasi = 0.1, volume = 0.15;
            switch (type) {
                case 'chop': freq = 150; durasi = 0.08; volume = 0.12; break;
                case 'hit': freq = 200; durasi = 0.15; volume = 0.2; break;
                case 'eat': freq = 300; durasi = 0.08; volume = 0.2; break;
                case 'place': freq = 400; durasi = 0.1; volume = 0.2; break;
                case 'hurt': freq = 100; durasi = 0.2; volume = 0.25; break;
                case 'levelup': freq = 600; durasi = 0.2; volume = 0.2; break;
                default: freq = 200;
            }
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(volume, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + durasi);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + durasi);
        }

        function startMusic() {
            if (!audioCtx || musicStarted) return;
            musicGain = audioCtx.createGain();
            musicGain.gain.value = musicEnabled ? 0.03 : 0;
            musicOsc1 = audioCtx.createOscillator();
            musicOsc1.type = 'sine';
            musicOsc1.frequency.value = 55;
            musicOsc1.connect(musicGain);
            musicOsc2 = audioCtx.createOscillator();
            musicOsc2.type = 'sine';
            musicOsc2.frequency.value = 110;
            musicOsc2.detune.value = 10;
            musicOsc2.connect(musicGain);
            musicGain.connect(audioCtx.destination);
            musicOsc1.start();
            musicOsc2.start();

            const pentatonic = [220, 247, 277, 330, 370, 440];
            function playMelody() {
                if (!musicEnabled || !audioCtx) return;
                const freq = pentatonic[Math.floor(Math.random() * pentatonic.length)];
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.value = 0.02;
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }
            musicMelodyInterval = setInterval(playMelody, 4000);
            musicStarted = true;
        }

        function stopMusic() {
            if (musicOsc1) { musicOsc1.stop(); musicOsc1 = null; }
            if (musicOsc2) { musicOsc2.stop(); musicOsc2 = null; }
            if (musicMelodyInterval) { clearInterval(musicMelodyInterval); musicMelodyInterval = null; }
            musicStarted = false;
        }

        function toggleMusic() {
            musicEnabled = !musicEnabled;
            if (musicGain) musicGain.gain.value = musicEnabled ? 0.03 : 0;
            if (musicEnabled && !musicStarted) startMusic();
        }

        // Ukuran dunia
        const worldWidth = 3000;
        const worldHeight = 3000;
        const CAHAYA_VISUAL_RADIUS = 100;
        const SAFE_ZONE_RADIUS = 120;
        
        const ITEM_DEFINITIONS = {
            kayu: { nama: 'Kayu', emoji: '🪵' },
            batu: { nama: 'Batu', emoji: '🪨' },
            ranting: { nama: 'Ranting', emoji: '🥢' },
            berry: { nama: 'Berry', emoji: '🫐' },
            daging_mentah: { nama: 'Daging Mentah', emoji: '🥩' },
            daging_masak: { nama: 'Daging Masak', emoji: '🍗' },
            kulit: { nama: 'Kulit', emoji: '🧶' },
            medkit: { nama: 'Medkit', emoji: '💊' },
            kapak: { nama: 'Kapak', emoji: '🪓' },
            campfire: { nama: 'Campfire', emoji: '🔥' },
            dinding: { nama: 'Dinding', emoji: '🧱' },
            crafting_table: { nama: 'Meja Kerja', emoji: '🪑' },
            pedang_kayu: { nama: 'Pedang Kayu', emoji: '🗡️' },
            pedang_batu: { nama: 'Pedang Batu', emoji: '⚔️' }
        };

        const MAX_STACK = 64;

        // Generate pulau
        const pulauPoints = [];
        const jumlahSegmen = 16;
        const radiusDasar = 1400;
        for (let i = 0; i < jumlahSegmen; i++) {
            const sudut = (i / jumlahSegmen) * Math.PI * 2;
            const variasi = Math.sin(i * 1.5) * 30 + Math.cos(i * 2) * 20;
            const r = radiusDasar + variasi;
            const x = worldWidth / 2 + Math.cos(sudut) * r;
            const y = worldHeight / 2 + Math.sin(sudut) * r;
            pulauPoints.push({ x, y });
        }

        // ==========================================
        // FUNGSI UTILITY
        // ==========================================
        function isInsidePulau(x, y) {
            let inside = false;
            for (let i = 0, j = pulauPoints.length - 1; i < pulauPoints.length; j = i++) {
                const xi = pulauPoints[i].x, yi = pulauPoints[i].y;
                const xj = pulauPoints[j].x, yj = pulauPoints[j].y;
                const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }
        
        function isInsidePulauMargin(x, y, margin) {
            const points = [
                { x, y }, { x: x + margin, y }, { x: x - margin, y },
                { x, y: y + margin }, { x, y: y - margin },
                { x: x + margin, y: y + margin }, { x: x - margin, y: y - margin },
                { x: x + margin, y: y - margin }, { x: x - margin, y: y + margin }
            ];
            return points.every(p => isInsidePulau(p.x, p.y));
        }

        function randomPosisiDalamPulau(margin = 0) {
            let x, y;
            do {
                x = Math.random() * (worldWidth - 100) + 50;
                y = Math.random() * (worldHeight - 100) + 50;
            } while (!isInsidePulauMargin(x, y, margin));
            return { x, y };
        }
        
        function isBlocked(x, y) {
            const obstacles = [...gameState.resources, ...gameState.campfires, ...gameState.walls, ...gameState.craftingTables];
            for (let obs of obstacles) {
                const dx = x - obs.x, dy = y - obs.y;
                if (Math.sqrt(dx*dx + dy*dy) < 15) return true;
            }
            return false;
        }

        function drawShadow(x, y, sizeX, sizeY, isCampfire = false) {
            let offsetX = 0, offsetY = 0;
            if (!isCampfire && gameState.malam && gameState.campfires.length > 0) {
                const offset = getShadowOffset(x, y);
                offsetX = offset.dx; offsetY = offset.dy;
            }
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(x + offsetX, y + offsetY, sizeX, sizeY, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function getShadowOffset(x, y) {
            let terdekat = null, jarakTerdekat = Infinity;
            for (const camp of gameState.campfires) {
                const dx = x - camp.x, dy = y - camp.y;
                const jarak = Math.sqrt(dx*dx + dy*dy);
                if (jarak < jarakTerdekat) { jarakTerdekat = jarak; terdekat = camp; }
            }
            if (!terdekat || jarakTerdekat < 1) return { dx: 0, dy: 0 };
            const dx = x - terdekat.x, dy = y - terdekat.y;
            const kuat = Math.max(0, 1 - jarakTerdekat / 300) * 6;
            return { dx: (dx / jarakTerdekat) * kuat, dy: (dy / jarakTerdekat) * kuat };
        }

        // FUNGSI BARU: jarak pemain ke api unggun terdekat
        function jarakKeCampfireTerdekat() {
            let jarakTerdekat = Infinity;
            for (const camp of gameState.campfires) {
                const dx = gameState.player.x - camp.x;
                const dy = gameState.player.y - camp.y;
                const jarak = Math.sqrt(dx*dx + dy*dy);
                if (jarak < jarakTerdekat) {
                    jarakTerdekat = jarak;
                }
            }
            return jarakTerdekat;
        }

        // ==========================================
        // CLASS DEFINITIONS
        // ==========================================
        class Entity {
            constructor(x, y) { this.x = x; this.y = y; }
        }

        class Player extends Entity {
            constructor() {
                super(worldWidth / 2, worldHeight / 2);
                this.size = 20;
                this.kecepatan = 110;
                this.lastDirX = 0; this.lastDirY = 1;
                this.keys = {};
                this.hurtUntil = 0;
                this.isMoving = false;
                this.walkTime = 0;
                this.slowUntil = 0;
            }

            update(deltaTime) {
                let dx = 0, dy = 0;
                if (this.keys['w'] || this.keys['ArrowUp']) dy -= 1;
                if (this.keys['s'] || this.keys['ArrowDown']) dy += 1;
                if (this.keys['a'] || this.keys['ArrowLeft']) dx -= 1;
                if (this.keys['d'] || this.keys['ArrowRight']) dx += 1;
                this.isMoving = dx !== 0 || dy !== 0;

                if (this.isMoving) {
                    const length = Math.sqrt(dx*dx + dy*dy);
                    dx /= length; dy /= length;
                    this.lastDirX = dx; this.lastDirY = dy;
                    this.walkTime += deltaTime;

                    let kecepatanSekarang = this.kecepatan;
                    if (performance.now() < this.slowUntil) kecepatanSekarang *= 0.5;
                    if (gameState.hunger <= 20 && gameState.hunger > 0) kecepatanSekarang *= 0.7;
                    else if (gameState.hunger === 0) kecepatanSekarang *= 0.5;

                    const newX = this.x + dx * kecepatanSekarang * deltaTime;
                    const newY = this.y + dy * kecepatanSekarang * deltaTime;
                    if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                    if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                } else {
                    this.walkTime = 0;
                }
            }

            draw() {
                const x = this.x, y = this.y;
                drawShadow(x, y + 8, 10, 4);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                const hurt = performance.now() < this.hurtUntil;
                const warnaBadan = hurt ? '#E74C3C' : '#4A90D9';
                const warnaKulit = hurt ? '#FF6B6B' : '#FFD1A6';

                ctx.fillStyle = warnaBadan;
                ctx.beginPath();
                ctx.ellipse(x, y, 7, 8, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                ctx.fillStyle = warnaKulit;
                ctx.beginPath();
                ctx.arc(x, y - 12, 5, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();

                const sway = this.isMoving ? Math.sin(this.walkTime * 12) * 2 : 0;
                const isHorizontal = Math.abs(this.lastDirX) > Math.abs(this.lastDirY);

                if (this.isMoving && isHorizontal) {
                    const side = this.lastDirX > 0 ? 1 : -1;
                    const handX = x + side * 6, handY = y - 2 + sway;
                    ctx.fillStyle = warnaKulit;
                    ctx.beginPath();
                    ctx.arc(handX, handY, 3, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                } else {
                    const leftHandX = x - 8, leftHandY = y - 2 + sway;
                    const rightHandX = x + 8, rightHandY = y - 2 - sway;
                    ctx.fillStyle = warnaKulit;
                    ctx.beginPath(); ctx.arc(leftHandX, leftHandY, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(rightHandX, rightHandY, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                }
                
                const eyeY = y - 12 + this.lastDirY * 2;
                ctx.fillStyle = '#111';
                if (isHorizontal) {
                    const eyeX = x + this.lastDirX * 3;
                    ctx.beginPath(); ctx.arc(eyeX, eyeY, 1.2, 0, Math.PI * 2); ctx.fill();
                } else {
                    ctx.beginPath(); ctx.arc(x - 2.5, eyeY, 1.2, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(x + 2.5, eyeY, 1.2, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillRect(x - 1.5, y - 9, 3, 1);

                // Indikator
                const jarakIndikator = 30;
                const indicatorX = x + this.lastDirX * jarakIndikator;
                const indicatorY = y + this.lastDirY * jarakIndikator;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(indicatorX - 5, indicatorY);
                ctx.lineTo(indicatorX + 5, indicatorY);
                ctx.moveTo(indicatorX, indicatorY - 5);
                ctx.lineTo(indicatorX, indicatorY + 5);
                ctx.stroke();
            }
        }

        class Resource extends Entity {
            constructor(x, y, tipe) {
                super(x, y);
                this.tipe = tipe;
                this.shakeUntil = 0;
                if (tipe === 'pohon') this.maxHp = 50;
                else if (tipe === 'batu') this.maxHp = 100;
                else if (tipe === 'semak') this.maxHp = 10;
                this.hp = this.maxHp;
            }
            
            draw() {
                ctx.strokeStyle = '#111';
                let renderX = this.x, renderY = this.y;
                if (performance.now() < this.shakeUntil) {
                    renderX += (Math.random() - 0.5) * 4;
                    renderY += (Math.random() - 0.5) * 4;
                }

                if (this.tipe === 'pohon') drawShadow(renderX, renderY + 10, 18, 5);
                else if (this.tipe === 'batu') drawShadow(renderX, renderY + 9, 14, 4);
                else if (this.tipe === 'semak') drawShadow(renderX, renderY + 10, 12, 4);
                
                ctx.lineWidth = 1.5;
                if (this.tipe === 'pohon') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(renderX - 4, renderY - 10, 8, 20);
                    ctx.strokeRect(renderX - 4, renderY - 10, 8, 20);
                    ctx.fillStyle = '#27AE60';
                    ctx.beginPath();
                    ctx.arc(renderX, renderY - 15, 12, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                } else if (this.tipe === 'batu') {
                    ctx.fillStyle = '#7F8C8D';
                    ctx.beginPath();
                    ctx.arc(renderX, renderY, 10, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#95A5A6';
                    ctx.beginPath();
                    ctx.arc(renderX - 3, renderY - 3, 4, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                } else if (this.tipe === 'semak') {
                    ctx.fillStyle = '#2ECC71';
                    ctx.beginPath();
                    ctx.arc(renderX, renderY, 12, 0, Math.PI * 2);
                    ctx.fill(); ctx.stroke();
                    ctx.fillStyle = '#FF0000';
                    const berries = [
                        { x: renderX - 4, y: renderY - 4 },
                        { x: renderX + 4, y: renderY - 3 },
                        { x: renderX, y: renderY + 5 }
                    ];
                    berries.forEach(b => {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                        ctx.fill(); ctx.stroke();
                    });
                }
            }
        }

        class Enemy extends Entity {
            constructor(x, y) {
                super(x, y);
                this.hp = 100;
                this.nextatteacktime = 0;
                this.speed = 1.5;
                this.arahX = Math.random() * 2 - 1;
                this.arahY = Math.random() * 2 - 1;
                this.shakeUntil = 0; 
            }

            update(gameState) {
                if (gameState.gameOver) return;
                const oldX = this.x, oldY = this.y;
                const jarakKePemain = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);
                const playerSafe = gameState.malam && jarakKeCampfireTerdekat() < SAFE_ZONE_RADIUS;

                let kelinciTerdekat = null, jarakKeKelinci = Infinity;
                for (let i = 0; i < gameState.kelincis.length; i++) {
                    const k = gameState.kelincis[i];
                    const jarak = Math.sqrt((this.x - k.x) ** 2 + (this.y - k.y) ** 2);
                    if (jarak < jarakKeKelinci) { jarakKeKelinci = jarak; kelinciTerdekat = i; }
                }

                let targetX = null, targetY = null, speed = this.speed;

                if (gameState.malam && jarakKePemain < 250 && !playerSafe) {
                    targetX = gameState.player.x; targetY = gameState.player.y;
                } else if (kelinciTerdekat !== null && jarakKeKelinci < 200) {
                    const target = gameState.kelincis[kelinciTerdekat];
                    targetX = target.x; targetY = target.y; speed = 1.8;
                } else {
                    if (!gameState.malam && jarakKePemain < 120) {
                        const arahX = (this.x - gameState.player.x) / jarakKePemain;
                        const arahY = (this.y - gameState.player.y) / jarakKePemain;
                        const newX = this.x + arahX * 0.5, newY = this.y + arahY * 0.5;
                        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                    } else {
                        if (!gameState.malam) {
                            const oldIdleX = this.x, oldIdleY = this.y;
                            this.x += this.arahX * 0.3;
                            this.y += this.arahY * 0.3;
                            if (!isInsidePulau(this.x, this.y) || isBlocked(this.x, this.y)) {
                                this.x = oldIdleX; this.y = oldIdleY;
                                this.ubahArahKeDalam();
                            }
                        }
                    }
                }

                if (targetX !== null && targetY !== null) {
                    const jarakKeTarget = Math.sqrt((targetX - this.x) ** 2 + (targetY - this.y) ** 2);
                    if (jarakKeTarget > 1) {
                        const arahX = (targetX - this.x) / jarakKeTarget;
                        const arahY = (targetY - this.y) / jarakKeTarget;
                        const startX = this.x, startY = this.y;
                        const newX = this.x + arahX * speed, newY = this.y + arahY * speed;
                        if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                        if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                        const jarakGerak = Math.sqrt((this.x - startX) ** 2 + (this.y - startY) ** 2);
                        if (jarakGerak < 0.5) {
                            let sideX = -arahY, sideY = arahX;
                            let newSideX = this.x + sideX * speed, newSideY = this.y + sideY * speed;
                            if (isInsidePulau(newSideX, newSideY) && !isBlocked(newSideX, newSideY)) {
                                this.x = newSideX; this.y = newSideY;
                            } else {
                                sideX = arahY; sideY = -arahX;
                                newSideX = this.x + sideX * speed; newSideY = this.y + sideY * speed;
                                if (isInsidePulau(newSideX, newSideY) && !isBlocked(newSideX, newSideY)) {
                                    this.x = newSideX; this.y = newSideY;
                                }
                            }
                        }
                    }
                }
                
                if (gameState.malam) {
                    for (let camp of gameState.campfires) {
                        const dx = this.x - camp.x, dy = this.y - camp.y;
                        const jarak = Math.sqrt(dx*dx + dy*dy);
                        if (jarak < SAFE_ZONE_RADIUS) {
                            const sudut = Math.atan2(dy, dx);
                            this.x = camp.x + Math.cos(sudut) * SAFE_ZONE_RADIUS;
                            this.y = camp.y + Math.sin(sudut) * SAFE_ZONE_RADIUS;
                        }
                    }
                }

                if (!isInsidePulau(this.x, this.y)) {
                    this.x = oldX; this.y = oldY;
                    this.ubahArahKeDalam();
                }

                if (kelinciTerdekat !== null && jarakKeKelinci < 15) {
                    gameState.kelincis.splice(kelinciTerdekat, 1);
                    gameState.jadwalkanRespawn('kelinci');
                    this.hp = Math.min(this.hp + 10, 30);
                    gameState.pesan = '🐺 Serigala memakan kelinci!';
                }

                const jarakSekarang = Math.sqrt((gameState.player.x - this.x) ** 2 + (gameState.player.y - this.y) ** 2);
                if (gameState.malam && jarakSekarang < 25 && performance.now() > this.nextatteacktime && !playerSafe) {
                    gameState.kesehatan -= 5;
                    playSound('hurt');
                    if (gameState.kesehatan < 0) gameState.kesehatan = 0;
                    gameState.pesan = '🐺 Kamu digigit serigala!';
                    this.nextatteacktime = performance.now() + 2000;
                    gameState.screenShakeUntil = performance.now() + 150;
                    if (gameState.player) {
                        gameState.player.hurtUntil = performance.now() + 200;
                        gameState.player.slowUntil = performance.now() + 3000;
                    }
                    if (gameState.kesehatan === 0) {
                        gameState.gameOver = true;
                        gameState.pesan = 'Kamu mati diserang serigala...';
                    }
                }
            }
            
            ubahArahKeDalam() {
                const pusatX = worldWidth / 2, pusatY = worldHeight / 2;
                const dx = pusatX - this.x, dy = pusatY - this.y;
                const jarak = Math.sqrt(dx*dx + dy*dy) || 1;
                const sudut = Math.atan2(dy, dx) + (Math.random() - 0.5) * Math.PI / 3;
                this.arahX = Math.cos(sudut);
                this.arahY = Math.sin(sudut);
            }

            draw() {
                let shakeX = 0, shakeY = 0;
                if (performance.now() < this.shakeUntil) {
                    shakeX = (Math.random() - 0.5) * 6;
                    shakeY = (Math.random() - 0.5) * 6;
                }
                const x = this.x + shakeX, y = this.y + shakeY;
                drawShadow(x, y + 10, 14, 5);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#95A5A6';
                ctx.beginPath(); ctx.arc(x + 8, y - 5, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#FF0000';
                ctx.beginPath(); ctx.arc(x + 9, y - 7, 2, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#7F8C8D';
                ctx.beginPath(); ctx.arc(x - 12, y + 5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }

        class Kelinci extends Entity {
            constructor(x, y) {
                super(x, y);
                this.arahX = Math.random() * 2 - 1;
                this.arahY = Math.random() * 2 - 1;
                this.timer = Math.floor(Math.random() * 50);
                this.hp = 50; this.maxHp = 50;
                this.shakeUntil = 0;
            }

            update(gameState) {
                if (gameState.gameOver) return;
                let serigalaTerdekat = null, jarakSerigala = Infinity;
                for (let i = 0; i < gameState.enemies.length; i++) {
                    const s = gameState.enemies[i];
                    const d = Math.sqrt((this.x - s.x) ** 2 + (this.y - s.y) ** 2);
                    if (d < jarakSerigala) { jarakSerigala = d; serigalaTerdekat = i; }
                }
                let semakTerdekat = null, jarakSemak = Infinity;

                if (jarakSerigala < 120) {
                    const s = gameState.enemies[serigalaTerdekat];
                    const dx = this.x - s.x, dy = this.y - s.y;
                    const jarak = Math.sqrt(dx*dx + dy*dy) || 1;
                    this.arahX = dx / jarak; this.arahY = dy / jarak;
                    this.timer = 0;
                } else {
                    for (let i = 0; i < gameState.resources.length; i++) {
                        const r = gameState.resources[i];
                        if (r.tipe === 'semak') {
                            const d = Math.sqrt((this.x - r.x) ** 2 + (this.y - r.y) ** 2);
                            if (d < jarakSemak) { jarakSemak = d; semakTerdekat = i; }
                        }
                    }
                    if (semakTerdekat !== null && jarakSemak < 150) {
                        const semak = gameState.resources[semakTerdekat];
                        const dx = semak.x - this.x, dy = semak.y - this.y;
                        const jarak = Math.sqrt(dx*dx + dy*dy) || 1;
                        this.arahX = dx / jarak; this.arahY = dy / jarak;
                        this.timer = 0;
                    } else {
                        this.timer++;
                        if (this.timer > 50) { this.ubahArahAcak(); this.timer = 0; }
                    }
                }
                const speed = 0.8;
                const newX = this.x + this.arahX * speed;
                if (isInsidePulau(newX, this.y) && !isBlocked(newX, this.y)) this.x = newX;
                else this.ubahArahAcak(true);
                const newY = this.y + this.arahY * speed;
                if (isInsidePulau(this.x, newY) && !isBlocked(this.x, newY)) this.y = newY;
                else this.ubahArahAcak(true);
                if (semakTerdekat !== null && jarakSemak < 15) {
                    gameState.resources.splice(semakTerdekat, 1);
                    gameState.jadwalkanRespawn('semak');
                    gameState.pesan = '🐇 Kelinci memakan semak berry!';
                }
            }

            ubahArahAcak(jauhiLaut = false) {
                if (jauhiLaut) {
                    const pusatX = worldWidth / 2, pusatY = worldHeight / 2;
                    const dx = pusatX - this.x, dy = pusatY - this.y;
                    const sudutDasar = Math.atan2(dy, dx);
                    const sudut = sudutDasar + (Math.random() - 0.5) * Math.PI / 2;
                    this.arahX = Math.cos(sudut); this.arahY = Math.sin(sudut);
                } else {
                    const sudut = Math.random() * Math.PI * 2;
                    this.arahX = Math.cos(sudut); this.arahY = Math.sin(sudut);
                }
                this.timer = 0;
            }

            draw() {
                let shakeX = 0, shakeY = 0;
                if (performance.now() < this.shakeUntil) {
                    shakeX = (Math.random() - 0.5) * 4;
                    shakeY = (Math.random() - 0.5) * 4;
                }
                const x = this.x + shakeX, y = this.y + shakeY;
                drawShadow(x, y + 6, 10, 4);
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                ctx.fillStyle = '#D2B48C';
                ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#DEB887';
                ctx.beginPath(); ctx.arc(x + 6, y - 4, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#A0522D';
                ctx.fillRect(x + 3, y - 12, 2, 6);
                ctx.fillRect(x + 6, y - 12, 2, 6);
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(x - 8, y + 2, 3, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }
        }

        class Campfire extends Entity {
            draw() {
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 1.5;
                drawShadow(this.x, this.y + 6, 12, 4, true);
                ctx.fillStyle = '#8B4513';

            },

            jadwalkanRespawn(tipe) {
                this.respawnList.push({ tipe: tipe, waktu: Date.now() + this.RESPAWN_DELAY[tipe] });
            },

            cekRespawn() {
                const sekarang = Date.now();
                for (let i = this.respawnList.length - 1; i >= 0; i--) {
                    const item = this.respawnList[i];
                    if (sekarang >= item.waktu) {
                        const pos = randomPosisiDalamPulau();
                        if (item.tipe === 'pohon') this.resources.push(new Resource(pos.x, pos.y, 'pohon'));
                        else if (item.tipe === 'batu') this.resources.push(new Resource(pos.x, pos.y, 'batu'));
                        else if (item.tipe === 'semak') this.resources.push(new Resource(pos.x, pos.y, 'semak'));
                        else if (item.tipe === 'kelinci') this.kelincis.push(new Kelinci(pos.x, pos.y));
                        else if (item.tipe === 'serigala') this.enemies.push(new Enemy(pos.x, pos.y));
                        this.respawnList.splice(i, 1);
                    }
                }
            },

            simpanGame() {
                try {
                    const data = {
                        playerX: this.player.x, playerY: this.player.y,
                        slots: this.slots, selectedSlot: this.selectedSlot,
                        craftingSlots: this.craftingSlots,
                        craftingTableSlots: this.craftingTableSlots,
                        xp: this.xp, level: this.level, hunger: this.hunger, kesehatan: this.kesehatan,
                        gameOver: this.gameOver, jam: this.jam, malam: this.malam,
                        punyaKapak: this.punyaKapak, kapakDurability: this.kapakDurability,
                        resources: this.resources.map(r => ({ x: r.x, y: r.y, tipe: r.tipe, hp: r.hp, maxHp: r.maxHp })),
                        enemies: this.enemies.map(e => ({ x: e.x, y: e.y, hp: e.hp })),
                        kelincis: this.kelincis.map(k => ({ x: k.x, y: k.y, hp: k.hp })),
                        campfires: this.campfires.map(c => ({ x: c.x, y: c.y })),
                        walls: this.walls.map(w => ({ x: w.x, y: w.y })),
                        craftingTables: this.craftingTables.map(ct => ({ x: ct.x, y: ct.y })),
                        respawnList: this.respawnList
                    };
                    localStorage.setItem('pulauSurvivalSave', JSON.stringify(data));
                    this.pesan = '💾 Game disimpan!';
                } catch (e) { this.pesan = '❌ Gagal menyimpan!'; }
            },

            muatGame() {
                try {
                    const json = localStorage.getItem('pulauSurvivalSave');
                    if (!json) { this.pesan = '❌ Tidak ada save!'; return; }
                    const data = JSON.parse(json);
                    this.restartGame();
                    this.player.x = data.playerX; this.player.y = data.playerY;
                    this.slots = data.slots; this.selectedSlot = data.selectedSlot;
                    this.craftingSlots = data.craftingSlots || new Array(4).fill(null);
                    this.craftingTableSlots = data.craftingTableSlots || new Array(9).fill(null);
                    this.xp = data.xp; this.level = data.level; this.hunger = data.hunger; this.kesehatan = data.kesehatan;
                    this.gameOver = data.gameOver; this.jam = data.jam; this.malam = data.malam;
                    this.punyaKapak = data.punyaKapak; this.kapakDurability = data.kapakDurability ?? this.kapakMaxDurability;
                    this.resources = data.resources.map(r => { const res = new Resource(r.x, r.y, r.tipe); res.hp = r.hp; res.maxHp = r.maxHp; return res; });
                    this.enemies = data.enemies.map(e => { const enemy = new Enemy(e.x, e.y); enemy.hp = e.hp; return enemy; });
                    this.kelincis = data.kelincis.map(k => { const kel = new Kelinci(k.x, k.y); kel.hp = k.hp; return kel; });
                    this.campfires = data.campfires.map(c => new Campfire(c.x, c.y));
                    this.walls = data.walls.map(w => new Wall(w.x, w.y));
                    this.craftingTables = (data.craftingTables || []).map(ct => new CraftingTable(ct.x, ct.y));
                    this.respawnList = data.respawnList || [];
                    this.pesan = '📂 Game dimuat!';
                } catch (e) { this.pesan = '❌ Data korup!'; }
            },

            restartGame() {
                this.player = new Player();
                this.player.keys = this.keys;
                this.resources = []; this.enemies = []; this.kelincis = []; this.campfires = []; this.walls = []; this.craftingTables = [];
                this.slots = new Array(24).fill(null);
                this.craftingSlots = new Array(4).fill(null);
                this.craftingTableSlots = new Array(9).fill(null);
                this.craftingTableOpen = false;
                this.selectedSlot = 0;
                this.respawnList = [];

                const jPohon = Math.floor(Math.random() * 10) + 35;
                const jBatu = Math.floor(Math.random() * 8) + 28;
                const jSemak = Math.floor(Math.random() * 10) + 30;
                for (let i = 0; i < jPohon; i++) { const pos = randomPosisiDalamPulau(30); this.resources.push(new Resource(pos.x, pos.y, 'pohon')); }
                for (let i = 0; i < jBatu; i++) { const pos = randomPosisiDalamPulau(25); this.resources.push(new Resource(pos.x, pos.y, 'batu')); }
                for (let i = 0; i < jSemak; i++) { const pos = randomPosisiDalamPulau(20); this.resources.push(new Resource(pos.x, pos.y, 'semak')); }

                for (let i = 0; i < 15; i++) { const pos = randomPosisiDalamPulau(10); this.enemies.push(new Enemy(pos.x, pos.y)); }
                for (let i = 0; i < 20; i++) { const pos = randomPosisiDalamPulau(10); this.kelincis.push(new Kelinci(pos.x, pos.y)); }

                this.xp = 0; this.level = 1; this.hunger = 100; this.kesehatan = 100; this.gameOver = false; this.jam = 8; this.malam = false;
                this.punyaKapak = false; this.kapakDurability = 0; this.pesan = 'Kamu terdampar!';
                restartButton.style.display = 'none';
                this.lastUpdateTime = performance.now();
                this.lastHungerTime = performance.now();
                this.lastFrameTime = performance.now();
            }
        };

        // ==========================================
        // RENDER FUNCTIONS
        // ==========================================

        function gambarPulau() {
            ctx.beginPath();
            const first = pulauPoints[0];
            ctx.moveTo(first.x, first.y);
            for (let i = 1; i < pulauPoints.length; i++) {
                const prev = pulauPoints[i - 1], curr = pulauPoints[i];
                const midX = (prev.x + curr.x) / 2, midY = (prev.y + curr.y) / 2;
                ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
            }
            const last = pulauPoints[pulauPoints.length - 1], firstAgain = pulauPoints[0];
            const midX = (last.x + firstAgain.x) / 2, midY = (last.y + firstAgain.y) / 2;
            ctx.quadraticCurveTo(last.x, last.y, midX, midY);
            ctx.closePath();
            ctx.fillStyle = '#F4D03F';
            ctx.fill();
            ctx.strokeStyle = '#D4A24E';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function gambarMinimap() {
            const minimapW = 120, minimapH = 120, margin = 10;
            const mapX = canvas.width - minimapW - margin, mapY = 40;
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(mapX, mapY, minimapW, minimapH);
            const scaleX = minimapW / worldWidth, scaleY = minimapH / worldHeight;
            ctx.save();
            ctx.beginPath();
            const first = pulauPoints[0];
            ctx.moveTo(mapX + first.x * scaleX, mapY + first.y * scaleY);
            for (let i = 1; i < pulauPoints.length; i++) {
                const prev = pulauPoints[i - 1], curr = pulauPoints[i];
                const midX = ((prev.x + curr.x) / 2) * scaleX + mapX;
                const midY = ((prev.y + curr.y) / 2) * scaleY + mapY;
                ctx.quadraticCurveTo(mapX + prev.x * scaleX, mapY + prev.y * scaleY, midX, midY);
            }
            const last = pulauPoints[pulauPoints.length - 1], firstAgain = pulauPoints[0];
            const midX = ((last.x + firstAgain.x) / 2) * scaleX + mapX;
            const midY = ((last.y + firstAgain.y) / 2) * scaleY + mapY;
            ctx.quadraticCurveTo(mapX + last.x * scaleX, mapY + last.y * scaleY, midX, midY);
            ctx.closePath();
            ctx.fillStyle = '#F4D03F'; ctx.fill();
            ctx.strokeStyle = '#D4A24E'; ctx.lineWidth = 2; ctx.stroke();
            if (gameState.player) {
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath(); ctx.arc(mapX + gameState.player.x * scaleX, mapY + gameState.player.y * scaleY, 3, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
            }
            gameState.campfires.forEach(c => { ctx.fillStyle = '#FF4500'; ctx.beginPath(); ctx.arc(mapX + c.x * scaleX, mapY + c.y * scaleY, 2.5, 0, Math.PI * 2); ctx.fill(); });
            gameState.walls.forEach(w => { ctx.fillStyle = '#8B4513'; ctx.fillRect(mapX + w.x * scaleX - 1, mapY + w.y * scaleY - 1, 2, 2); });
            gameState.craftingTables.forEach(ct => { ctx.fillStyle = '#D2B48C'; ctx.fillRect(mapX + ct.x * scaleX - 2, mapY + ct.y * scaleY - 2, 4, 4); });
            ctx.restore();
        }

            }

            // ===== MENU INVENTORY + CRAFTING =====
            if (gameState.showMenu) {
                const cols = 8, rows = 3, slotSize = 48, gap = 6;
                const gridW = cols * slotSize + (cols - 1) * gap;
                const gridH = rows * slotSize + (rows - 1) * gap;
                const startX = (canvas.width - gridW) / 2;
                const startY = (canvas.height - gridH) / 2 - 20;
                
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(startX - 20, startY - 40, gridW + 40, gridH + 80);
                
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 18px Arial';
                ctx.fillText('🎒 INVENTORY', startX, startY - 15);
                ctx.font = '14px Arial';

        function updateKeysFromJoystick() {
            if (!gameState.joystickActive) return;

            gameState.keys['w'] = false;
            gameState.keys['a'] = false;
            gameState.keys['s'] = false;
            gameState.keys['d'] = false;

            const dx = gameState.joystickX, dy = gameState.joystickY;
            if (Math.abs(dx) > 0.3 || Math.abs(dy) > 0.3) {
                if (dx > 0.3) gameState.keys['d'] = true;
                else if (dx < -0.3) gameState.keys['a'] = true;
                if (dy > 0.3) gameState.keys['s'] = true;
                else if (dy < -0.3) gameState.keys['w'] = true;
            }
        }

        function render() {
            const cameraX = gameState.player.x - canvas.width / 2;
            const cameraY = gameState.player.y - canvas.height / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2E86C1';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let shakeX = 0, shakeY = 0;
            if (performance.now() < gameState.screenShakeUntil) {
                shakeX = (Math.random() - 0.5) * gameState.screenShakeIntensity;
                shakeY = (Math.random() - 0.5) * gameState.screenShakeIntensity;
            }
            ctx.save();
            ctx.translate(-cameraX + shakeX, -cameraY + shakeY);
            gambarPulau();

            const entitiesToRender = [
                ...gameState.resources, ...gameState.campfires, ...gameState.walls,
                ...gameState.craftingTables, ...gameState.kelincis, ...gameState.enemies,
                gameState.player
            ];
            entitiesToRender.sort((a, b) => a.y - b.y);
            entitiesToRender.forEach(entity => entity.draw());
            
            gameState.floatingTexts.forEach(ft => {
                const alpha = ft.life / ft.maxLife;
                ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 16px Arial';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1;
            });
            ctx.restore();

            if (gameState.malam) {
                ctx.fillStyle = 'rgba(0,0,40,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const waktu = performance.now();
                gameState.campfires.forEach((c, index) => {
                    const screenX = c.x - cameraX + shakeX;
                    const screenY = c.y - cameraY + shakeY;
                    const flicker = Math.sin(waktu * 0.001 + index * 1.5) * 0.5 + 0.5;
                    const radius = CAHAYA_VISUAL_RADIUS + flicker * 20;
                    const alpha = 0.6 + flicker * 0.25;
                    const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, radius);
                    gradient.addColorStop(0, `rgba(255, 200, 100, ${alpha})`);
                    gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
                    ctx.fillStyle = gradient;
                    ctx.beginPath(); ctx.arc(screenX, screenY, radius, 0, Math.PI * 2); ctx.fill();
                });
            }

            gambarUI();
            gambarMinimap();
            gambarTouchControls();
        }

        // ==========================================
        // GAMEPLAY FUNCTIONS
        // ==========================================

        function tambahXP(jumlah) {
            gameState.xp += jumlah;
            if (gameState.xp >= gameState.xpPerLevel) {
                gameState.xp -= gameState.xpPerLevel;
                gameState.level++;
                playSound('levelup');
                spawnFloatingText(gameState.player.x, gameState.player.y - 30, 'LEVEL UP!', '#FFFF00');
                gameState.pesan = 'LEVEL UP! Sekarang level ' + gameState.level;
            }
        }
        
        function spawnFloatingText(x, y, text, color = '#FFFFFF') {
            gameState.floatingTexts.push({ x, y, text, color, life: 1.2, maxLife: 1.2, vy: 20 });
        }
        
        function addItem(id, jumlah = 1) {
            for (let i = 0; i < gameState.slots.length; i++) {
                const slot = gameState.slots[i];
                if (slot && slot.id === id && slot.jumlah < MAX_STACK) {
                    const available = MAX_STACK - slot.jumlah;
                    const adding = Math.min(available, jumlah);
                    slot.jumlah += adding;
                    jumlah -= adding;
                    if (jumlah <= 0) return;
                }
            }
            for (let i = 0; i < gameState.slots.length; i++) {
                if (!gameState.slots[i]) {
                    gameState.slots[i] = { id, jumlah };
                    return;
                }
            }
            gameState.pesan = 'Inventory penuh!';
        }

        function removeItem(id, jumlah = 1) {
            for (let i = 0; i < gameState.slots.length; i++) {
                const slot = gameState.slots[i];
                if (slot && slot.id === id) {
                    const removed = Math.min(slot.jumlah, jumlah);
                    slot.jumlah -= removed;
                    jumlah -= removed;
                    if (slot.jumlah <= 0) gameState.slots[i] = null;
                    if (jumlah <= 0) return true;
                }
            }
            return false;
        }

        function getItemCount(id) {
            let total = 0;
            for (const slot of gameState.slots) {
                if (slot && slot.id === id) total += slot.jumlah;
            }
            return total;
        }

        // ===== FUNGSI BARU: hitungItem =====
        function hitungItem(slots) {
            const counts = {};
            for (const slot of slots) {
                if (slot) {
                    counts[slot.id] = (counts[slot.id] || 0) + slot.jumlah;
                }
            }
            return counts;
        }

        // ===== CRAFTING RECIPES =====
        function arraysEqual(a, b) {
            if (a.length !== b.length) return false;
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        function matchRecipe3x3() {
            const slots = gameState.craftingTableSlots;
            const ids = slots.map(s => s ? s.id : null);
            const counts = hitungItem(slots);
            const totalItems = slots.reduce((sum, slot) => sum + (slot ? slot.jumlah : 0), 0);

            // === Resep Ranting: 1 Kayu → 1 Ranting ===
            if (counts['kayu'] === 1 && totalItems === 1) {
                return { id: 'ranting', jumlah: 1 };
            }

            // === RESEP PEDANG KAYU (2 Kayu + 1 Ranting, pola Minecraft) ===
            // Kolom kiri
            const recipeSwordLeft = [
                'kayu', null, null,
                'kayu', null, null,
                'ranting', null, null
            ];
            // Kolom tengah
            const recipeSwordMiddle = [
                null, 'kayu', null,
                null, 'kayu', null,
                null, 'ranting', null
            ];
            // Kolom kanan
            const recipeSwordRight = [
                null, null, 'kayu',
                null, null, 'kayu',
                null, null, 'ranting'
            ];

            if (arraysEqual(ids, recipeSwordLeft) || arraysEqual(ids, recipeSwordMiddle) || arraysEqual(ids, recipeSwordRight)) {
                return { id: 'pedang_kayu', jumlah: 1 };
            }

            // Resep Dinding
            const recipeWall = [
                'kayu', 'kayu', 'kayu',
                'kayu', 'kayu', 'kayu',
                null, null, null
            ];
            if (arraysEqual(ids, recipeWall)) {
                return { id: 'dinding', jumlah: 1 };
            }

            // Resep Kapak Batu (3 Batu + 2 Ranting, pola Minecraft)
            const recipeAxe = [
                'batu', 'batu', 'batu',
                'batu', 'ranting', null,
                null, 'ranting', null
            ];
            if (arraysEqual(ids, recipeAxe)) {
                return { id: 'kapak', jumlah: 1 };
            }

            // Resep Pedang Batu (2 Batu + 1 Ranting, pola Minecraft)
            const recipeSwordBatu = [
                null, 'batu', null,
                null, 'batu', null,
                null, 'ranting', null
            ];
            if (arraysEqual(ids, recipeSwordBatu)) {
                return { id: 'pedang_batu', jumlah: 1 };
            }

            // Resep Medkit (1 Kulit + 1 Berry, posisi bebas)
            if (counts['kulit'] === 1 && counts['berry'] === 1 && totalItems === 2) {
                return { id: 'medkit', jumlah: 1 };
            }

            // Resep Campfire (2 Kayu + 1 Batu, posisi bebas)
            if (counts['kayu'] === 2 && counts['batu'] === 1 && totalItems === 3) {
                return { id: 'campfire', jumlah: 1 };
            }

            return null;
        }

        function doCraft3x3() {
            const result = matchRecipe3x3();
            if (result) {
                for (let i = 0; i < 9; i++) {
                    if (gameState.craftingTableSlots[i]) {
                        gameState.craftingTableSlots[i].jumlah -= 1;
                        if (gameState.craftingTableSlots[i].jumlah <= 0) {
                            gameState.craftingTableSlots[i] = null;
                        }
                    }
                }
                addItem(result.id, result.jumlah);

                // Jika kapak dibuat, aktifkan status kapak
                if (result.id === 'kapak') {
                    gameState.punyaKapak = true;
                    gameState.kapakDurability = gameState.kapakMaxDurability;
                }

                gameState.pesan = '✅ Berhasil crafting!';
                playSound('levelup');
                gameState.craftingTableResult = null;
            } else {
                gameState.pesan = '❌ Resep tidak valid!';
            }
        }

        // ===== FUNGSI BARU: tryCraft2x2 =====
        function tryCraft2x2() {
            console.log('tryCraft2x2 dipanggil'); // DEBUG
            const slots = gameState.craftingSlots;
            const counts = hitungItem(slots);
            const totalItems = slots.reduce((sum, slot) => sum + (slot ? slot.jumlah : 0), 0);
            console.log('counts:', counts, 'totalItems:', totalItems); // DEBUG

            // === Resep Ranting: 1 Kayu → 1 Ranting ===
            if (counts['kayu'] === 1 && totalItems === 1) {
                for (let i = 0; i < slots.length; i++) {
                    if (slots[i] && slots[i].id === 'kayu') {
                        slots[i].jumlah -= 1;
                        if (slots[i].jumlah <= 0) slots[i] = null;
                        break;
                    }
                }
                addItem('ranting', 1);
                gameState.pesan = '🥢 Ranting berhasil dibuat!';
                playSound('chop');
                tambahXP(2);
                return true;
            }

            // === Resep Meja Kerja: 4 Kayu → 1 Meja Kerja ===
            if (counts['kayu'] === 4 && totalItems === 4) {
                for (let i = 0; i < 4; i++) {
                    if (slots[i] && slots[i].id === 'kayu') {
                        slots[i].jumlah -= 1;
                        if (slots[i].jumlah <= 0) slots[i] = null;
                    }
                }
                addItem('crafting_table', 1);
                gameState.pesan = '🪑 Meja Kerja berhasil dibuat!';
                playSound('levelup');
                tambahXP(10);
                return true;
            }

            // === Resep Medkit: 1 Kulit + 1 Berry → 1 Medkit ===
            if (counts['kulit'] === 1 && counts['berry'] === 1 && totalItems === 2) {
                let consumedKulit = false, consumedBerry = false;
                for (let i = 0; i < 4; i++) {
                    if (slots[i]) {
                        if (slots[i].id === 'kulit' && !consumedKulit) {
                            slots[i].jumlah -= 1;
                            consumedKulit = true;
                        } else if (slots[i].id === 'berry' && !consumedBerry) {
                            slots[i].jumlah -= 1;
                            consumedBerry = true;
                        }
                        if (slots[i].jumlah <= 0) slots[i] = null;
                    }
                }
                addItem('medkit', 1);
                gameState.pesan = '💊 Medkit berhasil dibuat!';
                playSound('levelup');
                tambahXP(5);
                return true;
            }

            // === Resep Campfire: 2 Kayu + 1 Batu → 1 Campfire ===
            if (counts['kayu'] === 2 && counts['batu'] === 1 && totalItems === 3) {
                let consumedKayu = 0, consumedBatu = false;
                for (let i = 0; i < slots.length; i++) {
                    if (slots[i]) {
                        if (slots[i].id === 'kayu' && consumedKayu < 2) {
                            const used = Math.min(slots[i].jumlah, 2 - consumedKayu);
                            slots[i].jumlah -= used;
                            consumedKayu += used;
                        } else if (slots[i].id === 'batu' && !consumedBatu) {
                            slots[i].jumlah -= 1;
                            consumedBatu = true;
                        }
                        if (slots[i].jumlah <= 0) slots[i] = null;
                    }
                }
                addItem('campfire', 1);
                gameState.pesan = '🔥 Campfire berhasil dibuat!';
                playSound('levelup');
                tambahXP(5);
                return true;
            }

            gameState.pesan = '❌ Resep tidak valid!';
            return false;
        }

        // ===== FUNGSI INTERAKSI =====
        function isInFront(player, targetX, targetY, tolerance = 0.5) {
            const dx = targetX - player.x, dy = targetY - player.y;
            const jarak = Math.sqrt(dx*dx + dy*dy);
            if (jarak === 0) return true;
            const normX = dx / jarak, normY = dy / jarak;
            const dot = normX * player.lastDirX + normY * player.lastDirY;
            return dot > tolerance;
        }

        function closeCraftingTable() {
            gameState.craftingTableOpen = false;
            gameState.showMenu = false;
            gameState.craftingTableSlots = new Array(9).fill(null);
            gameState.craftingTableResult = null;
        }

        function interaksi() {
            const player = gameState.player;
            const activeSlot = gameState.slots[gameState.selectedSlot];

            // 1. Cek Meja Kerja
            let tableTerdekat = null;
            let jarakTable = Infinity;
            for (let i = 0; i < gameState.craftingTables.length; i++) {
                const t = gameState.craftingTables[i];
                const d = Math.sqrt((player.x - t.x) ** 2 + (player.y - t.y) ** 2);
                if (d < 50 && isInFront(player, t.x, t.y) && d < jarakTable) {
                    jarakTable = d;
                    tableTerdekat = i;
                }
            }

            if (tableTerdekat !== null && !gameState.craftingTableOpen) {
                gameState.craftingTableOpen = true;
                gameState.showMenu = true;
                gameState.craftingTableSlots = new Array(9).fill(null);
                gameState.craftingTableResult = null;
                gameState.pesan = '🪑 Meja Kerja terbuka! (3x3)';
                return;
            }

            if (gameState.craftingTableOpen) {
                closeCraftingTable();
                gameState.pesan = 'Meja Kerja ditutup.';
                return;
            }

            // 2. Aksi item
            if (activeSlot) {
                if (activeSlot.id === 'campfire') { tempatkanCampfire(); return; }
                if (activeSlot.id === 'dinding') { tempatkanDinding(); return; }
                if (activeSlot.id === 'crafting_table') { tempatkanCraftingTable(); return; }
                if (activeSlot.id === 'berry') { makanBerry(); return; }
                if (activeSlot.id === 'daging_masak' || activeSlot.id === 'daging_mentah') { makanDaging(); return; }
                if (activeSlot.id === 'medkit') { gunakanMedkit(); return; }
            }
            
            // 3. Serang musuh
            let musuhTerdekat = null, jarakMusuh = Infinity;
            for (let i = 0; i < gameState.enemies.length; i++) {
                const m = gameState.enemies[i];
                const d = Math.sqrt((player.x - m.x) ** 2 + (player.y - m.y) ** 2);
                if (d < 50 && isInFront(player, m.x, m.y) && d < jarakMusuh) {
                    jarakMusuh = d; musuhTerdekat = i;
                }
            }
            if (musuhTerdekat !== null) {
                let damage = 10 + (gameState.level - 1) * 5;
                // Jika memegang pedang, damage lebih besar
                if (activeSlot && activeSlot.id === 'pedang_kayu') {
                    damage = 15 + (gameState.level - 1) * 5;
                } else if (activeSlot && activeSlot.id === 'pedang_batu') {
                    damage = 25 + (gameState.level - 1) * 5;
                }
                gameState.enemies[musuhTerdekat].hp -= damage;
                gameState.enemies[musuhTerdekat].shakeUntil = performance.now() + 150;
                spawnFloatingText(gameState.enemies[musuhTerdekat].x, gameState.enemies[musuhTerdekat].y - 20, '-' + damage, '#FF5555');
                playSound('hit');
                gameState.pesan = '⚔️ Kamu menyerang serigala! (-' + damage + ' HP)';
                if (gameState.enemies[musuhTerdekat].hp <= 0) {
                    gameState.pesan = '💀 Serigala mati!';
                    gameState.enemies.splice(musuhTerdekat, 1);
                    gameState.jadwalkanRespawn('serigala');
                    tambahXP(20);
                }
                return;
            }
            
            // 4. Serang kelinci
            let kelinciTerdekat = null, jarakKelinci = Infinity;
            for (let i = 0; i < gameState.kelincis.length; i++) {
                const k = gameState.kelincis[i];
                const d = Math.sqrt((player.x - k.x) ** 2 + (player.y - k.y) ** 2);
                if (d <= 30 && isInFront(player, k.x, k.y) && d < jarakKelinci) {
                    jarakKelinci = d; kelinciTerdekat = i;
                }
            }
            if (kelinciTerdekat !== null) {
                const kelinci = gameState.kelincis[kelinciTerdekat];
                playSound('hit');
                let damage = 10 + (gameState.level - 1) * 5;
                // Jika memegang pedang, damage lebih besar
                if (activeSlot && activeSlot.id === 'pedang_kayu') {
                    damage = 15 + (gameState.level - 1) * 5;
                } else if (activeSlot && activeSlot.id === 'pedang_batu') {
                    damage = 25 + (gameState.level - 1) * 5;
                }
                kelinci.hp -= damage;
                kelinci.shakeUntil = performance.now() + 150;
                if (kelinci.hp > 0) {
                    spawnFloatingText(kelinci.x, kelinci.y - 20, '-' + damage, '#FF5555');
                    gameState.pesan = `🐇 Kelinci terluka! (HP: ${kelinci.hp}/${kelinci.maxHp})`;
                } else {
                    gameState.kelincis.splice(kelinciTerdekat, 1);
                    gameState.jadwalkanRespawn('kelinci');
                    addItem('daging_mentah', 1);
                    addItem('kulit', 1);
                    spawnFloatingText(kelinci.x, kelinci.y - 20, '+1 🥩', '#00FF00');
                    spawnFloatingText(kelinci.x, kelinci.y - 35, '+1 Kulit', '#00FF00');
                    gameState.pesan = '🐇 Kelinci mati! (+1 Daging, +1 Kulit)';
                    tambahXP(10);
                }
                return;
            }

            // 5. Ambil Resource
            let resourceTerdekat = null, jarakResource = Infinity;
            for (let i = 0; i < gameState.resources.length; i++) {
                const r = gameState.resources[i];
                const d = Math.sqrt((player.x - r.x) ** 2 + (player.y - r.y) ** 2);
                if (d <= 40 && isInFront(player, r.x, r.y) && d < jarakResource) {
                    jarakResource = d; resourceTerdekat = i;
                }
            }
            if (resourceTerdekat !== null) {
                const r = gameState.resources[resourceTerdekat];
                playSound('chop');
                r.shakeUntil = performance.now() + 150;
                let dmg = 10;
                if (activeSlot && activeSlot.id === 'kapak' && gameState.punyaKapak) {
                    dmg = 25;
                    gameState.kapakDurability--;
                    if (gameState.kapakDurability <= 0) {
                        gameState.punyaKapak = false;
                        removeItem('kapak', 1);
                        gameState.pesan = '🪓 Kapak batu hancur!';
                    }
                }
                r.hp -= dmg;
                spawnFloatingText(r.x, r.y - 20, '-' + dmg, '#FFFFFF');
                if (r.hp <= 0) {
                    if (r.tipe === 'pohon') {
                        addItem('kayu', 1);
                        spawnFloatingText(r.x, r.y - 20, '+1 🪵', '#00FF00');
                        gameState.pesan = '🪵 Pohon tumbang! (+1 Kayu)';
                        tambahXP(5);
                    } else if (r.tipe === 'batu') {
                        addItem('batu', 1);
                        spawnFloatingText(r.x, r.y - 20, '+1 🪨', '#00FF00');
                        gameState.pesan = '🪨 Batu hancur! (+1 Batu)';
                        tambahXP(5);
                    } else if (r.tipe === 'semak') {
                        addItem('berry', 1);
                        spawnFloatingText(r.x, r.y - 20, '+1 🫐', '#00FF00');
                        gameState.pesan = '🫐 Semak dipanen! (+1 Berry)';
                        tambahXP(3);
                    }
                    gameState.resources.splice(resourceTerdekat, 1);
                    gameState.jadwalkanRespawn(r.tipe);
                }
                return;
            }
        }
        
        function hancurkanTerdekat() {
            const player = gameState.player;
            let terdekat = null;
            let jenis = null;
            let jarakTerdekat = 40; // jarak maksimum untuk menghancurkan
            
            // Cek campfire
            for (let i = 0; i < gameState.campfires.length; i++) {
                const obj = gameState.campfires[i];
                const jarak = Math.sqrt((player.x - obj.x) ** 2 + (player.y - obj.y) ** 2);
                if (jarak < jarakTerdekat && isInFront(player, obj.x, obj.y)) {
                    terdekat = i;
                    jenis = 'campfire';
                    jarakTerdekat = jarak;
                }
            }
            
            // Cek dinding
            for (let i = 0; i < gameState.walls.length; i++) {
                const obj = gameState.walls[i];
                const jarak = Math.sqrt((player.x - obj.x) ** 2 + (player.y - obj.y) ** 2);
                if (jarak < jarakTerdekat && isInFront(player, obj.x, obj.y)) {
                    terdekat = i;
                    jenis = 'dinding';
                    jarakTerdekat = jarak;
                }
            }
            
            // Cek crafting table
            for (let i = 0; i < gameState.craftingTables.length; i++) {
                const obj = gameState.craftingTables[i];
                const jarak = Math.sqrt((player.x - obj.x) ** 2 + (player.y - obj.y) ** 2);
                if (jarak < jarakTerdekat && isInFront(player, obj.x, obj.y)) {
                    terdekat = i;
                    jenis = 'crafting_table';
                    jarakTerdekat = jarak;
                }
            }
            
            if (jenis === null) {
                gameState.pesan = '❌ Tidak ada bangunan di depanmu!';
                return;
            }
            
            // Hapus objek dan kembalikan item ke inventory
            if (jenis === 'campfire') {
                gameState.campfires.splice(terdekat, 1);
                addItem('campfire', 1);
                gameState.pesan = '🔥 Campfire dihancurkan, +1 Campfire';
            } else if (jenis === 'dinding') {
                gameState.walls.splice(terdekat, 1);
                addItem('dinding', 1);
                gameState.pesan = '🧱 Dinding dihancurkan, +1 Dinding';
            } else if (jenis === 'crafting_table') {
                gameState.craftingTables.splice(terdekat, 1);
                addItem('crafting_table', 1);
                gameState.pesan = '🪑 Meja Kerja dihancurkan, +1 Meja Kerja';
            }
            
            playSound('chop');
        }

        // ===== ITEM SPECIFIC FUNCTIONS (SUDAH DIISI) =====
        function makanBerry() {
            if (removeItem('berry', 1)) {
                gameState.hunger = Math.min(gameState.hunger + 10, 100);
                playSound('eat');
                gameState.pesan = '🫐 Kamu makan berry. +10 Hunger';
            }
        }

        function makanDaging() {
            const slot = gameState.slots[gameState.selectedSlot];
            if (!slot) return;
            if (slot.id === 'daging_masak') {
                if (removeItem('daging_masak', 1)) {
                    gameState.hunger = Math.min(gameState.hunger + 25, 100);
                    gameState.kesehatan = Math.min(gameState.kesehatan + 5, 100);
                    playSound('eat');
                    gameState.pesan = '🍗 Kamu makan daging masak. +25 Hunger, +5 HP';
                }
            } else if (slot.id === 'daging_mentah') {
                if (removeItem('daging_mentah', 1)) {
                    gameState.hunger = Math.min(gameState.hunger + 10, 100);
                    gameState.kesehatan = Math.max(gameState.kesehatan - 5, 0);
                    playSound('eat');
                    gameState.pesan = '🥩 Kamu makan daging mentah. +10 Hunger, -5 HP';
                    if (gameState.kesehatan <= 0) {
                        gameState.gameOver = true;
                        gameState.pesan = 'Kamu keracunan daging mentah...';
                    }
                }
            }
        }

        function gunakanMedkit() {
            if (removeItem('medkit', 1)) {
                gameState.kesehatan = Math.min(gameState.kesehatan + 40, 100);
                playSound('eat');
                gameState.pesan = '💊 Kamu menggunakan medkit. +40 HP';
            }
        }

            const posX = player.x + player.lastDirX * 40;

                if (removeItem('campfire', 1)) {
                    gameState.campfires.push(new Campfire(posX, posY));
                    playSound('place');
                    gameState.pesan = '🔥 Campfire ditempatkan!';
                }
            } else {
                gameState.pesan = '❌ Tidak bisa menempatkan di sini!';

            const posY = player.y + player.lastDirY * 40;
